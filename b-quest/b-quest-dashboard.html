<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>B-QUEST | Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="/system/multi-select.js"></script>
    <script src="b-quest.js"></script>

    <style>
        :root {
            --c-accent: #bdc432;
            --c-accent-light: #f4f7a1;
            --c-dark: #1e293b;
            --c-bg: #f8fafc;
            --c-muted: #94a3b8;
            --c-slate: #626e7f;
            --c-border: #e2e8f0;
        }

        body { font-family: 'Inter', 'Sarabun', sans-serif; background: var(--c-bg); color: var(--c-dark); margin: 0; padding-bottom: 80px; }

        /* ── Control Bar ── */
        .ctrl-bar { background: #fff; border-bottom: 1px solid var(--c-border); padding: 10px 20px; position: sticky; top: 0; z-index: 200; }
        .ctrl-inner { max-width: 1300px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
        .month-nav { display: flex; align-items: center; gap: 6px; position: relative; }
        .month-nav-btn { border: 1px solid var(--c-border); background: #fff; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--c-slate); transition: 0.15s; font-size: 0.82rem; }
        .month-nav-btn:hover { background: var(--c-bg); border-color: #cbd5e1; }

        .month-label-btn { border: 1px solid var(--c-border); background: #fff; border-radius: 10px; padding: 0 14px; height: 32px; font-size: 0.88rem; font-weight: 800; color: var(--c-dark); cursor: pointer; min-width: 148px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.15s; font-family: inherit; }
        .month-label-btn:hover { background: var(--c-bg); border-color: #cbd5e1; }
        .month-label-btn.open { background: var(--c-accent-light); border-color: var(--c-accent); color: #5a6400; }

        /* ── Month Picker Popover ── */
        .month-picker {
            display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: #fff; border: 1px solid var(--c-border); border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12); padding: 14px 16px; width: 240px; z-index: 300;
        }
        .month-picker.open { display: block; }
        .mp-year { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .mp-year-btn { border: none; background: var(--c-bg); border-radius: 7px; width: 28px; height: 28px; cursor: pointer; color: var(--c-slate); font-size: 0.8rem; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
        .mp-year-btn:hover { background: var(--c-border); }
        .mp-year-label { font-size: 0.88rem; font-weight: 800; color: var(--c-dark); }
        .mp-months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .mp-month { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 7px 4px; font-size: 0.75rem; font-weight: 700; color: var(--c-slate); cursor: pointer; text-align: center; transition: 0.15s; font-family: inherit; }
        .mp-month:hover { background: var(--c-bg); border-color: var(--c-border); color: var(--c-dark); }
        .mp-month.active { background: var(--c-dark); color: var(--c-accent); border-color: var(--c-dark); }
        .mp-month.today { border-color: var(--c-accent); color: #5a6400; }
        .mp-month.active.today { background: var(--c-dark); color: var(--c-accent); }

        .ctrl-sep { width: 1px; height: 22px; background: var(--c-border); }
        .btn-today { border: 1px solid var(--c-border); background: #fff; border-radius: 8px; padding: 0 14px; height: 32px; font-size: 0.74rem; font-weight: 700; color: var(--c-slate); cursor: pointer; transition: 0.15s; font-family: inherit; }
        .btn-today:hover { background: var(--c-bg); border-color: #cbd5e1; }

        /* ── Wrapper ── */
        .dash-wrapper { max-width: 1300px; margin: 0 auto; padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 20px; }

        /* ── Filter Row (Role seg + Person multi-select) ──
           These mirror b-quest.css's .role-seg-*/.flt-select-* rules
           verbatim (same class names/behavior) — copied here rather than
           loading b-quest.css itself, since this page's CSS is meant to
           stay self-contained per this project's convention (Dashboard
           shares no markup with List/Assignment/Settings). */
        .dash-filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .role-seg-wrap { position: relative; display: flex; align-items: center; background: #fff; border: 1px solid var(--c-border); border-radius: 20px; height: 38px; flex-shrink: 0; overflow: hidden; width: 420px; max-width: 100%; }
        .role-seg-label { flex-shrink: 0; background: #f1f5f9; color: #64748b; font-size: 0.6rem; font-weight: 800; padding: 0 10px; height: 100%; display: flex; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: 0.5px; border-right: 1px solid var(--c-border); white-space: nowrap; }
        .role-seg-scroll-outer { position: relative; flex: 1; min-width: 0; height: 100%; }
        .role-seg-scroll { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; height: 100%; padding: 3px; overflow-x: auto; scrollbar-width: none; }
        .role-seg-scroll::-webkit-scrollbar { display: none; }
        .role-seg-slider { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; background: var(--c-accent-light); border: 1px solid var(--c-accent); border-radius: 17px; transition: left 0.25s cubic-bezier(.4,0,.2,1), width 0.25s cubic-bezier(.4,0,.2,1); z-index: 0; }
        .role-seg-scroll-outer::before, .role-seg-scroll-outer::after { content: ''; position: absolute; top: 1px; bottom: 1px; width: 32px; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.2s; }
        .role-seg-scroll-outer::before { left: 0; background: linear-gradient(to right, rgba(30,41,59,0.16), transparent); }
        .role-seg-scroll-outer::after { right: 0; background: linear-gradient(to left, rgba(30,41,59,0.16), transparent); }
        .role-seg-scroll-outer.fade-left::before { opacity: 1; }
        .role-seg-scroll-outer.fade-right::after { opacity: 1; }
        .role-seg-btn { position: relative; z-index: 1; border: none; background: transparent; padding: 0 14px; height: 100%; font-size: 0.74rem; font-weight: 700; color: var(--c-slate); cursor: pointer; white-space: nowrap; transition: color 0.2s; flex-shrink: 0; display: flex; align-items: center; gap: 5px; }
        .role-seg-btn.active { color: #7a8500; }
        .role-seg-btn:not(.active):hover { color: var(--c-accent); }

        .flt-select-box { background: #fff; border: 1px solid var(--c-border); border-radius: 20px; display: flex; align-items: center; overflow: hidden; height: 38px; transition: 0.2s; width: 220px; flex-shrink: 0; }
        .flt-select-box:hover { border-color: var(--c-accent); box-shadow: 0 2px 8px rgba(189,196,50,0.2); transform: translateY(-1px); }
        .flt-select-tag { background: #f1f5f9; color: #64748b; font-size: 0.6rem; font-weight: 800; padding: 0 10px; height: 100%; display: flex; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: 0.5px; border-right: 1px solid var(--c-border); white-space: nowrap; transition: 0.2s; }
        .flt-select-box:hover .flt-select-tag { background: #e8edf2; color: var(--c-slate); }
        .flt-select-input { border: none; font-size: 0.8rem; font-weight: 600; color: var(--c-slate); padding: 0 8px; width: 100%; outline: none; background: transparent; cursor: pointer; font-family: inherit; text-align-last: center; }
        .flt-select-box.active-filter { background: var(--c-accent-light); border-color: var(--c-accent); }
        .flt-select-box.active-filter .flt-select-tag { background: var(--c-accent); color: var(--c-dark); border-right-color: var(--c-accent); }

        /* ── Section ── */
        .section { background: #fff; border: 1px solid var(--c-border); border-radius: 20px; overflow: hidden; }
        .section-header { display: flex; align-items: center; gap: 10px; padding: 15px 24px; border-bottom: 1px solid var(--c-border); }
        .section-title { font-size: 0.76rem; font-weight: 800; color: var(--c-dark); text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 8px; }
        .section-body { padding: 20px 24px; }

        /* Calendar is the hero of the page — bigger radius/shadow/padding
           than every section below it. */
        .section-hero { border-radius: 26px; box-shadow: 0 12px 36px -10px rgba(30,41,59,0.14); border-color: #e5e9f0; }
        .section-hero .section-header { padding: 20px 28px; }
        .section-hero .section-title { font-size: 0.92rem; letter-spacing: 0.6px; }
        .section-hero .section-title i { font-size: 1.05rem; color: var(--c-accent); }
        .section-hero .section-body { padding: 22px 28px 28px; }

        /* Sections below the calendar are visually secondary — smaller
           headers, tighter padding — still fully present, just quieter. */
        .section-secondary .section-header { padding: 11px 20px; }
        .section-secondary .section-title { font-size: 0.68rem; opacity: 0.82; letter-spacing: 0.6px; }
        .section-secondary .section-body { padding: 16px 20px 18px; }

        /* ── Overview ── */
        .ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .ov-card { border: 1px solid var(--c-border); border-radius: 14px; padding: 16px 18px; }
        .ov-val { font-size: 1.7rem; font-weight: 900; color: var(--c-dark); line-height: 1; }
        .ov-label { font-size: 0.65rem; font-weight: 700; color: var(--c-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; }
        .ov-card.ov-active { border-color: var(--c-accent); background: var(--c-accent-light); }
        .ov-card.ov-active .ov-val { color: #5a6400; }

        /* ── Role as a DATA DIMENSION, not a layout axis. Every secondary
           section below is ONE unified chart/table spanning all active
           roles (colored/badged per row or per series) instead of a
           repeated column per role — reads consistently whether there are
           2 roles or 8, and the Role filter above narrows it in place. ── */
        .role-badge-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 20px; font-size: 0.68rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
        .role-badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

        /* ── Daily Capacity — one %-of-capacity line per role, normalized
           so roles with different max_capacity are still comparable on the
           same 0-100%+ axis. A dashed 100% line marks the overload point. ── */
        .cap-chart-wrap { padding: 12px 16px 8px; height: 260px; }
        .cap-empty-cap-note { font-size: 0.68rem; color: var(--c-muted); padding: 0 16px 10px; }

        /* ── Work Types — one stacked bar per Type, segments colored/
           stacked by role, so "which role does this type" reads at a
           glance instead of needing N separate donuts. ── */
        .wt-chart-wrap { padding: 12px 16px 8px; height: 280px; }

        /* ── Work Breakdown / Person Summary — one table each, Role shown
           as a leading badge column instead of a repeated table per role.
           Grouped by role (role order), sorted within each group same as
           before. ── */
        .wb-table-head, .wb-row { display: grid; grid-template-columns: 96px 1fr 56px 70px; gap: 8px; align-items: center; padding: 8px 16px; }
        .wb-table-head { background: var(--c-bg); font-size: 0.6rem; font-weight: 800; color: var(--c-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .wb-table-head span:not(:first-child) { text-align: center; }
        .wb-row { border-top: 1px solid #f8fafc; transition: background 0.15s; }
        .wb-row:hover { background: #fafbff; }
        .wb-row.wb-zero { opacity: 0.4; }
        .wb-name { font-size: 0.82rem; font-weight: 600; color: var(--c-dark); }
        .wb-num { font-size: 0.82rem; font-weight: 800; text-align: center; }
        .wb-weight-bar { height: 4px; background: var(--c-bg); border-radius: 4px; margin-top: 3px; overflow: hidden; }
        .wb-weight-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }

        .ps-table-head, .ps-row { display: grid; grid-template-columns: 96px 1fr 52px 52px 60px; gap: 8px; align-items: center; padding: 9px 16px; }
        .ps-table-head { background: var(--c-bg); font-size: 0.6rem; font-weight: 800; color: var(--c-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .ps-table-head span:not(:first-child) { text-align: center; }
        .ps-row { border-top: 1px solid #f8fafc; transition: background 0.15s; }
        .ps-row:hover { background: #fafbff; }
        .ps-name { font-size: 0.82rem; font-weight: 700; color: var(--c-dark); }
        .ps-num { font-size: 0.82rem; font-weight: 800; text-align: center; }

        /* ── Empty / Skeleton ── */
        .col-empty { padding: 24px; text-align: center; color: var(--c-muted); font-size: 0.78rem; font-weight: 600; }
        .skel { background: #f1f5f9; border-radius: 8px; animation: shimmer 1.4s infinite; }
        @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:0.5} }

        /* ── Calendar Heatmap (hero — one unified grid) ── */
        .cal-grid-wrap { padding: 4px 0 0; }
        .cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
        .cal-dow { font-size: 0.66rem; font-weight: 800; color: var(--c-muted); text-align: center; text-transform: uppercase; letter-spacing: 0.3px; padding: 2px 0; }
        .cal-week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
        .cal-day {
            border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            border: 1.5px solid transparent; transition: 0.15s; position: relative;
            font-size: 0.7rem; font-weight: 700; color: var(--c-slate);
            background: var(--c-bg); padding: 10px 3px 11px; gap: 5px; min-height: 64px;
        }
        .cal-day:hover { border-color: #cbd5e1; }
        .cal-day.cal-empty { background: transparent; cursor: default; pointer-events: none; }
        .cal-day.cal-today { border-color: var(--c-accent) !important; color: #5a6400; }
        .cal-day.cal-selected { border-color: var(--c-dark) !important; box-shadow: 0 0 0 2px var(--c-dark); }
        .cal-day.cal-selected.cal-today { border-color: var(--c-accent) !important; box-shadow: 0 0 0 2px var(--c-accent); }
        .cal-day-num { line-height: 1; font-size: 0.9rem; }

        /* past days — muted */
        .cal-day.cal-past { opacity: 0.35; }
        .cal-day.cal-past:hover { opacity: 0.65; border-color: #cbd5e1; }

        /* badges inside cell */
        .cal-badges { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
        .cal-badge {
            font-size: 0.55rem; font-weight: 800; padding: 1px 5px;
            border-radius: 4px; line-height: 1.5; letter-spacing: 0.2px;
        }
        .cal-badge-task { background: rgba(220,38,38,0.15); color: #b91c1c; font-weight: 900; }
        .cal-badge-ongoing { background: rgba(0,0,0,0.06); color: inherit; opacity: 0.75; }
        .cal-badge-over { background: #dc2626; color: #fff !important; }

        /* over-capacity — a hard class (not inline) so it can safely sit
           above cal-today/cal-selected's own !important border rule
           without a specificity fight. */
        .cal-day.cal-heat-over { background: #fee2e2 !important; color: #991b1b !important; border-color: #ef4444 !important; }

        /* ── Day Detail Modal ── */
        #day-modal-backdrop {
            position: fixed; inset: 0; background: rgba(15,23,42,0.45);
            backdrop-filter: blur(2px); z-index: 900;
            animation: fadeIn 0.18s ease;
        }
        #day-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 901; background: #fff; border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.18); width: 92%; max-width: 1040px;
            max-height: 82vh; display: flex; flex-direction: column;
            animation: slideUp 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, -46%) } to { opacity: 1; transform: translate(-50%, -50%) } }

        .dm-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 22px; border-bottom: 1px solid var(--c-border); flex-shrink: 0;
        }
        .dm-title { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 800; color: var(--c-dark); }
        .dm-title i { color: var(--c-accent); font-size: 1rem; }
        .dm-close {
            border: none; background: var(--c-bg); border-radius: 8px;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--c-slate); font-size: 0.8rem; transition: 0.15s;
        }
        .dm-close:hover { background: #f1f5f9; color: var(--c-dark); }
        /* One column per active role — flex row that scrolls horizontally
           once 3+ roles are shown, rather than a fixed 2-up grid. */
        .dm-body { display: flex; overflow-x: auto; overflow-y: auto; flex: 1; }
        .dm-col { padding: 18px 20px; flex: 1 1 260px; min-width: 240px; }
        .dm-col + .dm-col { border-left: 1px solid var(--c-border); }

        .day-col-head { font-size: 0.67rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .day-task-card {
            padding: 11px 14px; border-radius: 12px;
            border: 1px solid var(--c-border); margin-bottom: 8px; background: #fff;
            transition: border-color 0.15s; display: flex; flex-direction: column; gap: 6px;
        }
        .day-task-card:hover { border-color: #cbd5e1; background: var(--c-bg); }

        /* Row 1: Task name + Status */
        .day-task-row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .day-task-name { font-size: 0.84rem; font-weight: 700; color: var(--c-dark); line-height: 1.3; flex: 1; }
        .day-task-status { font-size: 0.63rem; font-weight: 800; padding: 2px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; letter-spacing: 0.2px; }

        /* Row 2: Account | Opp */
        .day-task-row2 { display: flex; align-items: center; gap: 5px; }
        .day-task-account { font-size: 0.72rem; font-weight: 600; color: var(--c-slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .day-task-opp { font-size: 0.72rem; color: var(--c-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .day-task-dot { font-size: 0.55rem; color: #cbd5e1; flex-shrink: 0; }

        /* Row 3: Work + Weight | Assign | Owner | Deadline */
        .day-task-row3 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid #f1f5f9; }
        .day-task-w { font-size: 0.68rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
        .day-task-meta { font-size: 0.68rem; font-weight: 600; color: var(--c-muted); display: flex; align-items: center; gap: 3px; }
        .day-task-meta i { font-size: 0.6rem; opacity: 0.6; }
        .day-task-spacer { flex: 1; }

        .day-empty { color: var(--c-muted); font-size: 0.78rem; font-weight: 600; padding: 8px 0; }

        @media (max-width: 700px) {
            .dm-body { flex-direction: column; }
            .dm-col + .dm-col { border-left: none; border-top: 1px solid var(--c-border); }
            .role-seg-wrap { width: 100%; }
        }
    </style>
</head>
<body>

<!-- Control Bar -->
<div class="ctrl-bar">
    <div class="ctrl-inner">
        <div class="month-nav">
            <button class="month-nav-btn" id="btn-prev"><i class="bi bi-chevron-left"></i></button>

            <button class="month-label-btn" id="month-label-btn">
                <i class="bi bi-calendar3" style="font-size:0.8rem"></i>
                <span id="month-label-text">—</span>
                <i class="bi bi-chevron-down" style="font-size:0.65rem;opacity:0.6"></i>
            </button>

            <!-- Month Picker Popover -->
            <div class="month-picker" id="month-picker">
                <div class="mp-year">
                    <button class="mp-year-btn" id="mp-prev-year"><i class="bi bi-chevron-left"></i></button>
                    <span class="mp-year-label" id="mp-year-label">2026</span>
                    <button class="mp-year-btn" id="mp-next-year"><i class="bi bi-chevron-right"></i></button>
                </div>
                <div class="mp-months" id="mp-months"></div>
            </div>

            <button class="month-nav-btn" id="btn-next"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="ctrl-sep"></div>
        <button class="btn-today" id="btn-today">This Month</button>
    </div>
</div>

<!-- Dashboard Content -->
<div class="dash-wrapper">

    <!-- Filters — Role + Person, narrows every section below at once -->
    <div class="dash-filter-row">
        <div class="role-seg-wrap">
            <span class="role-seg-label">Role</span>
            <div class="role-seg-scroll-outer" id="dashRoleSegOuter">
                <div class="role-seg-scroll" id="dashRoleSegWrap">
                    <div class="role-seg-slider" id="dashRoleSegSlider"></div>
                    <!-- Buttons rendered by roleSeg.render() from b-quest-role -->
                </div>
            </div>
        </div>
        <div class="flt-select-box" id="wrap-filterAssign"></div>
    </div>

    <!-- Calendar — hero of the page -->
    <div class="section section-hero">
        <div class="section-header">
            <div class="section-title"><i class="bi bi-calendar3-week-fill"></i> Calendar — Deadline Load</div>
        </div>
        <div class="section-body">
            <div class="cal-grid-wrap" id="cal-grid"></div>
        </div>
    </div>

    <!-- Overview -->
    <div class="section section-secondary">
        <div class="section-header">
            <div class="section-title"><i class="bi bi-grid-1x2-fill"></i> Overview</div>
        </div>
        <div class="section-body">
            <div class="ov-grid" id="ov-grid">
                <div class="ov-card" style="grid-column:1/6"><div class="skel" style="height:60px"></div></div>
            </div>
        </div>
    </div>

    <!-- Daily Capacity -->
    <div class="section section-secondary">
        <div class="section-header">
            <div class="section-title"><i class="bi bi-bar-chart-fill"></i> Daily Capacity</div>
        </div>
        <div class="section-body">
            <div class="cap-chart-wrap" id="cap-chart-wrap"><canvas id="chart-capacity"></canvas></div>
            <div class="cap-empty-cap-note" id="cap-note"></div>
        </div>
    </div>

    <!-- Work Types -->
    <div class="section section-secondary">
        <div class="section-header">
            <div class="section-title"><i class="bi bi-pie-chart-fill"></i> Work Types</div>
        </div>
        <div class="section-body">
            <div class="wt-chart-wrap" id="wt-chart-wrap"><canvas id="chart-worktypes"></canvas></div>
        </div>
    </div>

    <!-- Work Breakdown -->
    <div class="section section-secondary">
        <div class="section-header">
            <div class="section-title"><i class="bi bi-table"></i> Work Breakdown</div>
        </div>
        <div class="section-body">
            <div class="wb-table-head"><span>Role</span><span>Work</span><span>Tasks</span><span>% Done</span></div>
            <div id="wb-rows"></div>
        </div>
    </div>

    <!-- Person Summary -->
    <div class="section section-secondary">
        <div class="section-header">
            <div class="section-title"><i class="bi bi-people-fill"></i> Person Summary</div>
        </div>
        <div class="section-body">
            <div class="ps-table-head"><span>Role</span><span>Member</span><span>Tasks</span><span>Done</span><span>Weight</span></div>
            <div id="ps-rows"></div>
        </div>
    </div>

    <!-- Day Detail Modal -->
    <div id="day-modal-backdrop" style="display:none" onclick="closeDayModal()"></div>
    <div id="day-modal" style="display:none">
        <div class="dm-header">
            <div class="dm-title">
                <i class="bi bi-calendar-day"></i>
                <span id="dm-date">—</span>
            </div>
            <button class="dm-close" onclick="closeDayModal()"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="dm-body" id="dm-body"></div>
    </div>

</div>

<script>
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const CAL_HEAT_BASE = '#3b82f6'; // merged/"All" calendar heat color — a single role in the filter uses that role's own color instead

    let curYear, curMonth;
    let pickerYear;

    // ── Master data (loaded once) ──
    let roleList = [];       // active roles — [{id, name, color, icon, active}]
    let roleColorMap = {};   // role_id -> color (ALL roles, incl. inactive — an existing task-role row can reference a deactivated role)
    let roleNameMap = {};    // role_id -> name (ALL roles)
    let maxCapByRole = {};   // role_id -> max_capacity (from b-quest-role, ALL roles)
    let statusList = [];     // active statuses, sort_order-ascending — [{id, name, color}]
    let statusColorMap = {}; // status_id -> color (ALL statuses)
    let statusNameMap = {};  // status_id -> name (ALL statuses)
    let workList = [];       // b-quest-work rows — [{work, day, weight, max_per_day, role_id}]
    let taskRoleAssignRows = []; // [{role_id, assign}] — unfiltered snapshot, feeds the Person filter's grouped option list
    let workdayWeight = { sun: 100, mon: 100, tue: 100, wed: 100, thu: 100, fri: 100, sat: 100 };

    // ── Filter + per-month state ──
    let selectedAssigns = [];   // Person filter values (codenames)
    let monthRows = [];         // b-quest-task-role rows (+ joined quest) for the displayed month, already scoped by Role/Person filters
    let calSelectedDate = null;
    let assignFilter;
    let capacityChart = null;   // single unified Chart instance
    let worktypesChart = null;  // single unified Chart instance

    // ── Month helpers ──
    function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
    function pad(n) { return String(n).padStart(2, '0'); }
    function monthRange() {
        const start = `${curYear}-${pad(curMonth + 1)}-01`;
        const end   = `${curYear}-${pad(curMonth + 1)}-${pad(daysInMonth(curYear, curMonth))}`;
        return { start, end };
    }

    function initMonth() {
        const now = new Date();
        curYear  = now.getFullYear();
        curMonth = now.getMonth();
        updateLabel();
    }
    function updateLabel() {
        document.getElementById('month-label-text').textContent =
            new Date(curYear, curMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    // ── Month Picker ──
    function openPicker() {
        pickerYear = curYear;
        renderPickerMonths();
        document.getElementById('mp-year-label').textContent = pickerYear;
        document.getElementById('month-picker').classList.add('open');
        document.getElementById('month-label-btn').classList.add('open');
    }
    function closePicker() {
        document.getElementById('month-picker').classList.remove('open');
        document.getElementById('month-label-btn').classList.remove('open');
    }
    function renderPickerMonths() {
        const now = new Date();
        document.getElementById('mp-year-label').textContent = pickerYear;
        document.getElementById('mp-months').innerHTML = MONTHS.map((name, i) => {
            const isActive  = pickerYear === curYear && i === curMonth;
            const isToday   = pickerYear === now.getFullYear() && i === now.getMonth();
            const cls = [isActive ? 'active' : '', isToday ? 'today' : ''].join(' ');
            return `<button class="mp-month ${cls}" data-m="${i}">${name}</button>`;
        }).join('');
        document.querySelectorAll('.mp-month').forEach(btn => {
            btn.onclick = () => {
                curYear  = pickerYear;
                curMonth = parseInt(btn.dataset.m);
                updateLabel();
                closePicker();
                reloadAndRenderAll();
            };
        });
    }

    document.getElementById('month-label-btn').onclick = (e) => {
        e.stopPropagation();
        document.getElementById('month-picker').classList.contains('open') ? closePicker() : openPicker();
    };
    document.getElementById('mp-prev-year').onclick = (e) => { e.stopPropagation(); pickerYear--; renderPickerMonths(); };
    document.getElementById('mp-next-year').onclick = (e) => { e.stopPropagation(); pickerYear++; renderPickerMonths(); };
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.month-nav')) closePicker();
    });

    document.getElementById('btn-prev').onclick = () => {
        if (--curMonth < 0) { curMonth = 11; curYear--; }
        updateLabel(); reloadAndRenderAll();
    };
    document.getElementById('btn-next').onclick = () => {
        if (++curMonth > 11) { curMonth = 0; curYear++; }
        updateLabel(); reloadAndRenderAll();
    };
    document.getElementById('btn-today').onclick = () => {
        const now = new Date(); curYear = now.getFullYear(); curMonth = now.getMonth();
        updateLabel(); reloadAndRenderAll();
    };

    // ── Role filter (shared sliding-segment control from b-quest.js) ──
    const roleSeg = createRoleSegControl({
        wrapId: 'dashRoleSegWrap', outerId: 'dashRoleSegOuter', sliderId: 'dashRoleSegSlider',
        getButtons: () => [{ label: 'All', value: '', icon: '', color: '' }, ...roleList.map(r => ({ label: r.name, value: r.id, icon: r.icon || 'bi-person-workspace', color: roleColorMap[r.id] || '#64748b' }))],
        onSelect: value => setRoleFilter(value)
    });
    function getRoleFilter() { return roleSeg.getValue(); }
    // Roles the rest of the page should render columns for — every active
    // role when "All" is selected, just the one filtered role otherwise.
    function activeRoleList() {
        const v = getRoleFilter();
        return v ? roleList.filter(r => r.id === v) : roleList;
    }
    function setRoleFilter(value) {
        roleSeg.setActive(value);
        pruneAssignFilter();
        return reloadAndRenderAll();
    }

    // Person/Assign options grouped by Role, scoped to whichever role is
    // currently active — same idea as List's Assign filter.
    function assignOptions() {
        const active = getRoleFilter();
        const showAll = !active;
        const byRole = {};
        taskRoleAssignRows.forEach(r => { (byRole[r.role_id] ||= new Set()).add(r.assign); });
        const opts = [];
        roleList.forEach(r => {
            if (!showAll && r.id !== active) return;
            const names = [...(byRole[r.id] || [])].sort((a, b) => a.localeCompare(b, 'th'));
            names.forEach(name => opts.push({ value: name, label: name, group: `${r.name}s` }));
        });
        return opts;
    }
    // Drops any selected person no longer valid for the newly active role
    // (e.g. switching Role narrows the candidate pool) instead of leaving
    // the filter silently stuck on a name that can't match anything.
    function pruneAssignFilter() {
        if (!assignFilter) return;
        const valid = new Set(assignOptions().map(o => o.value));
        const kept = assignFilter.getValues().filter(v => valid.has(v));
        assignFilter.setValues(kept);
        selectedAssigns = kept;
    }

    // ── Status "done" heuristic ──
    // Status is now a fully admin-configured, dynamically-ordered list (no
    // fixed Progress/Done pair) — the last status in sort_order is treated
    // as the completion state, same convention Settings' default-status
    // fallback already leans on (a workflow is naturally configured in
    // order, e.g. Pending -> In Progress -> Done).
    function doneStatusId() { return statusList.length ? statusList[statusList.length - 1].id : null; }
    function isDoneStatus(statusId) { const d = doneStatusId(); return d != null && statusId === d; }

    // ── Master data (loaded once per page load) ──
    async function loadMasterData() {
        const [roleRes, statusRes, workRes, assignRes, cfgRes] = await Promise.all([
            supabaseClient.from('b-quest-role').select('id, name, color, icon, max_capacity, active').order('sort_order'),
            supabaseClient.from('b-quest-status').select('id, name, color, active').order('sort_order'),
            supabaseClient.from('b-quest-work').select('work, day, weight, max_per_day, role_id').order('work'),
            supabaseClient.from('b-quest-task-role').select('role_id, assign').not('assign', 'is', null),
            supabaseClient.from('b-quest-config').select('value').eq('rule', 'workday_weight').maybeSingle()
        ]);

        const allRoles = roleRes.data || [];
        roleList = allRoles.filter(r => r.active !== false);
        roleColorMap = Object.fromEntries(allRoles.map(r => [r.id, r.color || '#64748b']));
        roleNameMap = Object.fromEntries(allRoles.map(r => [r.id, r.name]));
        maxCapByRole = Object.fromEntries(allRoles.map(r => [r.id, r.max_capacity ?? 10]));

        const allStatuses = statusRes.data || [];
        statusList = allStatuses.filter(s => s.active !== false);
        statusColorMap = Object.fromEntries(allStatuses.map(s => [s.id, s.color || '#94a3b8']));
        statusNameMap = Object.fromEntries(allStatuses.map(s => [s.id, s.name]));

        workList = workRes.data || [];
        taskRoleAssignRows = assignRes.data || [];
        workdayWeight = { sun: 100, mon: 100, tue: 100, wed: 100, thu: 100, fri: 100, sat: 100, ...(cfgRes.data?.value || {}) };

        roleSeg.render();
    }

    // ── Fetch this month's task-role rows, scoped by Role/Person filters ──
    // Joined against b-quest-list for the task-level fields the Day Detail
    // modal needs (avoids an N+1 lookup per card). Only rows whose OWN
    // deadline falls in the displayed month are fetched — a row whose
    // deadline lands in a later month but whose Day-spread reaches back
    // into this month's tail end won't show (same scope the previous
    // per-role query used; not attempted to fix here since it's a
    // pre-existing edge case, not part of this rewrite's brief).
    async function fetchMonthRows() {
        const { start, end } = monthRange();
        let q = supabaseClient.from('b-quest-task-role')
            .select('*, quest:"b-quest-list"(id, account_name, opportunity_name, task_name, owner, link, publish_date)')
            .gte('deadline', start).lte('deadline', end);
        const roleFilter = getRoleFilter();
        if (roleFilter) q = q.eq('role_id', roleFilter);
        if (selectedAssigns.length) q = q.in('assign', selectedAssigns);
        const { data, error } = await q;
        if (error) { console.error(error); return []; }
        return data || [];
    }

    async function reloadAndRenderAll() {
        calSelectedDate = null;
        monthRows = await fetchMonthRows();
        renderCalendar();
        renderOverview();
        renderCapacity();
        renderWorkTypes();
        renderWorkBreakdown();
        renderPersons();
    }

    // ── Spread math (contributionOnDate/effectiveMaxCap are the shared
    // functions in b-quest.js — the same formula b-quest-modal.js's own
    // capacity check uses, so the two pages can never silently disagree on
    // what "over capacity" means). ──
    function spreadRoleRows(rows) {
        const { start, end } = monthRange();
        const weightMap = {}, dueCount = {}, ongoingCount = {};
        rows.forEach(r => {
            if (!r.deadline) return;
            const weight = Number(r.weight) || 0;
            const day = Number(r.day) || 1;
            const deadlineDate = new Date(r.deadline + 'T00:00:00');
            for (let i = 0; i < day; i++) {
                const dt = new Date(deadlineDate);
                dt.setDate(dt.getDate() - i);
                const ds = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
                if (ds < start || ds > end) continue;
                const contribution = contributionOnDate(weight, day, r.deadline, workdayWeight, ds);
                if (contribution <= 1e-9) continue;
                weightMap[ds] = (weightMap[ds] || 0) + contribution;
                if (ds === r.deadline) dueCount[ds] = (dueCount[ds] || 0) + 1;
                else ongoingCount[ds] = (ongoingCount[ds] || 0) + 1;
            }
        });
        return { weightMap, dueCount, ongoingCount };
    }
    // Merged capacity for a date — sum of every active role's own
    // effectiveMaxCap on that date (the "All" view's notion of team
    // capacity); a single filtered role just returns its own.
    function capOnDate(ds, roles) {
        return roles.reduce((sum, r) => sum + effectiveMaxCap(r.id, ds, maxCapByRole, workdayWeight), 0);
    }

    // ── Calendar Heatmap (hero, unified) ──
    function heatFor(baseColor, weight, cap) {
        if (weight <= 0) return null;
        const isOver = cap > 0 && weight > cap;
        if (isOver) return { over: true };
        const ratio = cap > 0 ? Math.min(weight / cap, 1) : Math.min(weight / 10, 1);
        const alpha = 0.15 + ratio * 0.65;
        return { over: false, bg: hexToRgba(baseColor, alpha), text: ratio > 0.55 ? '#fff' : '#1e293b' };
    }

    function buildCalGrid(containerId, weightMap, dueCountMap, ongoingCountMap, capFn, baseColor) {
        const el = document.getElementById(containerId);
        if (!el) return;
        const days = daysInMonth(curYear, curMonth);
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
        const firstDow = new Date(curYear, curMonth, 1).getDay();
        const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        let html = `<div class="cal-dow-row">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}</div>`;
        let dayNum = 1;
        for (let week = 0; week < 6; week++) {
            if (dayNum > days) break;
            html += `<div class="cal-week-row">`;
            for (let dow = 0; dow < 7; dow++) {
                const cellIdx = week * 7 + dow;
                if (cellIdx < firstDow || dayNum > days) {
                    html += `<div class="cal-day cal-empty"></div>`;
                } else {
                    const dateStr = `${curYear}-${pad(curMonth + 1)}-${pad(dayNum)}`;
                    const w = weightMap[dateStr] || 0;
                    const tc = dueCountMap[dateStr] || 0;
                    const oc = ongoingCountMap[dateStr] || 0;
                    const cap = capFn(dateStr);
                    const heat = heatFor(baseColor, w, cap);
                    const isToday = dateStr === todayStr;
                    const isPast = dateStr < todayStr;
                    const isSel = dateStr === calSelectedDate;
                    const cls = ['cal-day', heat?.over ? 'cal-heat-over' : '', isToday ? 'cal-today' : '', (isPast && !heat) ? 'cal-past' : '', isSel ? 'cal-selected' : ''].filter(Boolean).join(' ');
                    const style = (heat && !heat.over) ? ` style="background:${heat.bg};color:${heat.text}"` : '';
                    const isOver = !!heat?.over;
                    const badgeDue = tc > 0 ? `<span class="cal-badge ${isOver ? 'cal-badge-over' : 'cal-badge-task'}">${tc} due</span>` : '';
                    const badgeOng = oc > 0 ? `<span class="cal-badge cal-badge-ongoing">${oc} ongoing</span>` : '';
                    const badges = (tc > 0 || oc > 0) ? `<div class="cal-badges">${badgeDue}${badgeOng}</div>` : '';
                    html += `<div class="${cls}"${style} data-date="${dateStr}">
                        <span class="cal-day-num">${dayNum}</span>
                        ${badges}
                    </div>`;
                    dayNum++;
                }
            }
            html += `</div>`;
        }
        el.innerHTML = html;

        el.querySelectorAll('.cal-day:not(.cal-empty)').forEach(cell => {
            cell.onclick = () => {
                calSelectedDate = cell.dataset.date;
                renderCalendar();
                renderDayDetail(calSelectedDate);
            };
        });
    }

    function renderCalendar() {
        const roles = activeRoleList();
        const roleFilter = getRoleFilter();
        const baseColor = roleFilter ? (roleColorMap[roleFilter] || CAL_HEAT_BASE) : CAL_HEAT_BASE;
        const { weightMap, dueCount, ongoingCount } = spreadRoleRows(monthRows);

        const today = new Date();
        const todayStr = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
        const isCurrentMonth = today.getFullYear() === curYear && today.getMonth() === curMonth;
        if (!calSelectedDate && isCurrentMonth) calSelectedDate = todayStr;

        buildCalGrid('cal-grid', weightMap, dueCount, ongoingCount, ds => capOnDate(ds, roles), baseColor);
    }

    function closeDayModal() {
        calSelectedDate = null;
        document.getElementById('day-modal-backdrop').style.display = 'none';
        document.getElementById('day-modal').style.display = 'none';
        document.body.style.overflow = '';
        renderCalendar();
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDayModal(); });

    function dayDetailSectionLabel(text, mt = false) {
        return `<div style="font-size:0.6rem;font-weight:800;color:var(--c-muted);text-transform:uppercase;letter-spacing:0.6px;${mt ? 'margin:10px 0 6px' : 'margin-bottom:6px'}">${text}</div>`;
    }

    function dayTaskCardHtml(row, roleColor, isDue) {
        const q = row.quest || {};
        const statusColor = statusColorMap[row.status_id] || '#94a3b8';
        const statusName = statusNameMap[row.status_id] || row.status || 'Pending';
        return `
        <div class="day-task-card">
            <div class="day-task-row1">
                <span class="day-task-name">${esc(q.task_name) || '—'}</span>
                <span class="day-task-status" style="background:${hexToRgba(statusColor, 0.16)};color:${statusColor}">${esc(statusName)}</span>
            </div>
            <div class="day-task-row2">
                ${q.account_name ? `<span class="day-task-account">${esc(q.account_name)}</span>` : ''}
                ${q.account_name && q.opportunity_name ? `<span class="day-task-dot">|</span>` : ''}
                ${q.opportunity_name ? `<span class="day-task-opp">${esc(q.opportunity_name)}</span>` : ''}
            </div>
            <div class="day-task-row3">
                <span class="day-task-w" style="background:${hexToRgba(roleColor, 0.12)};color:${roleColor}">${esc(row.work) || '—'} • w: ${row.weight || 0}${isDue ? '' : '/day'}</span>
                <span class="day-task-spacer"></span>
                <span class="day-task-meta"><i class="bi bi-person-fill"></i>${esc(row.assign) || '—'}</span>
                <span class="day-task-dot">·</span>
                <span class="day-task-meta"><i class="bi bi-person-lines-fill"></i>${esc(q.owner) || '—'}</span>
                <span class="day-task-dot">·</span>
                <span class="day-task-meta"><i class="bi bi-calendar3"></i>${row.deadline || '—'}</span>
            </div>
        </div>`;
    }

    function dayColumnHtml(role, dateStr) {
        const color = roleColorMap[role.id] || '#64748b';
        const roleRows = monthRows.filter(r => r.role_id === role.id);
        const due = roleRows.filter(r => r.deadline === dateStr);
        const ongoing = roleRows.filter(r => r.deadline && r.deadline > dateStr &&
            contributionOnDate(Number(r.weight) || 0, r.day, r.deadline, workdayWeight, dateStr) > 1e-9);

        let inner = '';
        if (due.length) {
            if (ongoing.length) inner += dayDetailSectionLabel('📌 Due Today');
            inner += due.map(r => dayTaskCardHtml(r, color, true)).join('');
        }
        if (ongoing.length) {
            inner += dayDetailSectionLabel('🔄 Ongoing', due.length > 0);
            inner += ongoing.map(r => dayTaskCardHtml(r, color, false)).join('');
        }
        if (!inner) inner = `<div class="day-empty">No tasks</div>`;

        return `<div class="dm-col">
            <div class="day-col-head" style="color:${color}"><i class="bi ${role.icon || 'bi-person-workspace'}"></i> ${esc(role.name)}</div>
            ${inner}
        </div>`;
    }

    function renderDayDetail(dateStr) {
        const { start, end } = monthRange();
        if (dateStr < start || dateStr > end) return;

        const [y, m, d] = dateStr.split('-').map(Number);
        const label = new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('dm-date').textContent = label;

        const roles = activeRoleList();
        document.getElementById('dm-body').innerHTML = roles.length
            ? roles.map(role => dayColumnHtml(role, dateStr)).join('')
            : `<div class="dm-col"><div class="day-empty">No roles configured</div></div>`;

        document.getElementById('day-modal-backdrop').style.display = 'block';
        document.getElementById('day-modal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    // ── Overview ──
    function renderOverview() {
        const roles = activeRoleList();
        const questIds = new Set(monthRows.map(r => r.quest_id));
        const activeCount = monthRows.filter(r => !isDoneStatus(r.status_id)).length;
        const doneCount = monthRows.filter(r => isDoneStatus(r.status_id)).length;

        const roleCards = roles.map(role => {
            const color = roleColorMap[role.id] || '#64748b';
            const workingCount = new Set(monthRows.filter(r => r.role_id === role.id && r.assign).map(r => r.assign)).size;
            return `<div class="ov-card" style="border-color:${hexToRgba(color, 0.35)};background:${hexToRgba(color, 0.08)}">
                <div class="ov-val" style="color:${color}">${workingCount}</div>
                <div class="ov-label">${esc(role.name)} Working</div>
            </div>`;
        }).join('');

        document.getElementById('ov-grid').innerHTML = `
            <div class="ov-card">
                <div class="ov-val">${questIds.size}</div>
                <div class="ov-label">Total Tasks</div>
            </div>
            <div class="ov-card ov-active">
                <div class="ov-val">${activeCount}</div>
                <div class="ov-label">Role Rows Active</div>
            </div>
            <div class="ov-card">
                <div class="ov-val">${doneCount}</div>
                <div class="ov-label">Role Rows Done</div>
            </div>
            ${roleCards}
        `;
    }

    // ── Daily Capacity — one %-of-capacity line per role, normalized so
    // roles with different max_capacity stay comparable on one 0-100%+
    // axis (a raw-weight chart per role can't be compared like this). A
    // dashed 100% reference line marks the overload point for every role
    // at once, and the legend can toggle roles on/off (Chart.js default).
    function renderCapacity() {
        if (capacityChart) { capacityChart.destroy(); capacityChart = null; }
        const roles = activeRoleList();
        const wrap = document.getElementById('cap-chart-wrap');
        const noteEl = document.getElementById('cap-note');
        if (!roles.length) { wrap.innerHTML = `<div class="col-empty">No roles configured</div>`; noteEl.textContent = ''; return; }
        wrap.innerHTML = '<canvas id="chart-capacity"></canvas>';

        const days = daysInMonth(curYear, curMonth);
        const labels = Array.from({ length: days }, (_, i) => i + 1);

        const datasets = roles.map(role => {
            const color = roleColorMap[role.id] || '#64748b';
            const rows = monthRows.filter(r => r.role_id === role.id);
            const data = [];
            for (let d = 1; d <= days; d++) {
                const ds = `${curYear}-${pad(curMonth + 1)}-${pad(d)}`;
                let load = 0;
                rows.forEach(r => {
                    if (!r.deadline) return;
                    load += contributionOnDate(Number(r.weight) || 0, r.day, r.deadline, workdayWeight, ds);
                });
                const cap = effectiveMaxCap(role.id, ds, maxCapByRole, workdayWeight);
                data.push(cap > 0 ? Math.round(load / cap * 1000) / 10 : 0);
            }
            return { label: role.name, data, borderColor: color, backgroundColor: color, borderWidth: 2.25, pointRadius: 2, pointHoverRadius: 5, tension: 0.25, fill: false };
        });
        datasets.push({ label: '100% Cap', data: labels.map(() => 100), borderColor: 'rgba(239,68,68,0.55)', borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0, fill: false, order: 99 });

        noteEl.textContent = roles.map(r => `${r.name} max ${maxCapByRole[r.id] ?? '—'}/day`).join('   ·   ');

        const ctx = document.getElementById('chart-capacity').getContext('2d');
        capacityChart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: true, position: 'top', labels: { boxWidth: 10, font: { size: 10 }, color: '#64748b' } },
                    tooltip: { callbacks: { title: items => `Day ${items[0].label}`, label: item => ` ${item.dataset.label}: ${item.parsed.y}%` } }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0, color: '#94a3b8' } },
                    y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 }, color: '#94a3b8', callback: v => v + '%' } }
                }
            }
        });
    }

    // ── Work Types — one stacked bar per Type, segments colored/stacked by
    // role instead of N separate donuts, so "which role does this type"
    // reads at a glance regardless of how many roles exist.
    function renderWorkTypes() {
        if (worktypesChart) { worktypesChart.destroy(); worktypesChart = null; }
        const roles = activeRoleList();
        const wrap = document.getElementById('wt-chart-wrap');
        if (!roles.length) { wrap.innerHTML = `<div class="col-empty">No roles configured</div>`; return; }

        const typeTotals = {};
        monthRows.forEach(r => { if (r.type) typeTotals[r.type] = (typeTotals[r.type] || 0) + 1; });
        const types = Object.keys(typeTotals).sort((a, b) => typeTotals[b] - typeTotals[a]);
        if (!types.length) { wrap.innerHTML = `<div class="col-empty">No data this month</div>`; return; }
        wrap.innerHTML = '<canvas id="chart-worktypes"></canvas>';

        const datasets = roles.map(role => {
            const color = roleColorMap[role.id] || '#64748b';
            const counts = {};
            monthRows.filter(r => r.role_id === role.id && r.type).forEach(r => { counts[r.type] = (counts[r.type] || 0) + 1; });
            return { label: role.name, data: types.map(t => counts[t] || 0), backgroundColor: color, borderRadius: 3 };
        });

        const ctx = document.getElementById('chart-worktypes').getContext('2d');
        worktypesChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: types, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: true, position: 'top', labels: { boxWidth: 10, font: { size: 10 }, color: '#64748b' } },
                    tooltip: { callbacks: { label: item => ` ${item.dataset.label}: ${item.parsed.y}` } }
                },
                scales: {
                    x: { stacked: true, grid: { display: false }, ticks: { font: { size: 9 }, color: '#94a3b8' } },
                    y: { stacked: true, beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 }, color: '#94a3b8', precision: 0 } }
                }
            }
        });
    }

    // ── Work Breakdown — one table, Role shown as a leading badge column
    // instead of a repeated table per role. Rows grouped by role (already
    // sort_order-ascending via roleList/activeRoleList), sorted by task
    // count within each group, same as before.
    function renderWorkBreakdown() {
        const container = document.getElementById('wb-rows');
        const roles = activeRoleList();
        if (!roles.length) { container.innerHTML = `<div class="col-empty">No roles configured</div>`; return; }

        const allRows = [];
        roles.forEach(role => {
            const works = workList.filter(w => w.role_id === role.id);
            const roleRows = monthRows.filter(r => r.role_id === role.id);
            const rows = works.map(w => {
                const matched = roleRows.filter(r => r.work === w.work);
                const done = matched.filter(r => isDoneStatus(r.status_id)).length;
                const pct = matched.length ? Math.round(done / matched.length * 100) : null;
                return { role, work: w.work, tasks: matched.length, done, pct };
            }).sort((a, b) => b.tasks - a.tasks);
            allRows.push(...rows);
        });

        if (!allRows.length) { container.innerHTML = `<div class="col-empty">No work types configured</div>`; return; }

        container.innerHTML = allRows.map(r => {
            const color = roleColorMap[r.role.id] || '#64748b';
            const pctDisplay = r.pct !== null ? `${r.pct}%` : '—';
            const barColor = r.pct === 100 ? '#10b981' : hexToRgba(color, 0.4);
            return `
            <div class="wb-row${r.tasks === 0 ? ' wb-zero' : ''}">
                <span class="role-badge-chip" style="background:${hexToRgba(color, 0.12)};color:${color}"><span class="role-badge-dot" style="background:${color}"></span>${esc(r.role.name)}</span>
                <div>
                    <div class="wb-name">${esc(r.work)}</div>
                    ${r.tasks > 0 ? `<div class="wb-weight-bar"><div class="wb-weight-fill" style="width:${r.pct ?? 0}%;background:${barColor}"></div></div>` : ''}
                </div>
                <div class="wb-num" style="color:${r.tasks > 0 ? color : 'var(--c-muted)'}">${r.tasks}</div>
                <div class="wb-num" style="color:${r.pct === 100 ? '#10b981' : r.pct !== null ? 'var(--c-dark)' : 'var(--c-muted)'}">${pctDisplay}</div>
            </div>`;
        }).join('');
    }

    // ── Person Summary — one table, Role shown as a leading badge column
    // instead of a repeated table per role. Grouped by role, sorted by
    // weight within each group, same as before.
    function renderPersons() {
        const container = document.getElementById('ps-rows');
        const roles = activeRoleList();
        if (!roles.length) { container.innerHTML = `<div class="col-empty">No roles configured</div>`; return; }

        const allRows = [];
        roles.forEach(role => {
            const rows = monthRows.filter(r => r.role_id === role.id && r.assign);
            const map = {};
            rows.forEach(r => {
                const k = r.assign;
                if (!map[k]) map[k] = { tasks: 0, done: 0, weight: 0 };
                map[k].tasks++;
                if (isDoneStatus(r.status_id)) map[k].done++;
                map[k].weight += Number(r.weight) || 0;
            });
            const entries = Object.entries(map).sort((a, b) => b[1].weight - a[1].weight);
            entries.forEach(([name, d]) => allRows.push({ role, name, ...d }));
        });

        if (!allRows.length) { container.innerHTML = `<div class="col-empty">No data this month</div>`; return; }

        container.innerHTML = allRows.map(r => {
            const color = roleColorMap[r.role.id] || '#64748b';
            return `
            <div class="ps-row">
                <span class="role-badge-chip" style="background:${hexToRgba(color, 0.12)};color:${color}"><span class="role-badge-dot" style="background:${color}"></span>${esc(r.role.name)}</span>
                <div class="ps-name">${esc(r.name)}</div>
                <div class="ps-num" style="color:${color}">${r.tasks}</div>
                <div class="ps-num" style="color:${r.done === r.tasks && r.tasks > 0 ? '#10b981' : 'var(--c-slate)'}">${r.done}</div>
                <div class="ps-num" style="color:var(--c-dark)">${r.weight}</div>
            </div>`;
        }).join('');
    }

    // ── Guard — mirrors b-quest-settings.html's own guardPermission() ──
    function guardDashboardAccess() {
        const user = getBxUser();
        if (user?.level === 'god') return;
        const perms = getBquestPerms();
        if (!perms?.permissions?.includes('dashboard')) window.location.replace('b-quest-list.html');
    }

    // ── Init ──
    async function initPage() {
        sessionStorage.removeItem('bx_perms_bquest');
        await initLayout(B_QUEST_CONFIG);
        guardDashboardAccess();
        initMonth();
        await loadMasterData();
        document.getElementById('dashRoleSegWrap')?.addEventListener('scroll', () => roleSeg.updateFade());

        assignFilter = createMultiSelect({
            trigger: document.getElementById('wrap-filterAssign'),
            label: 'Person',
            getOptions: assignOptions,
            onChange: (values) => { selectedAssigns = values; reloadAndRenderAll(); },
            width: 260
        });

        await reloadAndRenderAll();
    }

    initPage();
</script>
</body>
