        `).join('');
    }

    function onRoleField(id, field, value) {
        if (!roleChanges[id]) roleChanges[id] = {};
        roleChanges[id][field] = value;
        markDirty('section-roles');
        if (field !== 'name') renderRoles();
    }

    function addRole() {
        const id = `new-${roleIdSeq--}`;
        const buf = roleBuffer();
        const maxOrder = Math.max(0, ...buf.map(r => r.sort_order || 0));
        roleChanges[id] = { name: '', color: nextAutoColor(buf.map(r => r.color)), icon: randomIcon(), max_capacity: 10, sort_order: maxOrder + 1, active: true };
        markDirty('section-roles');
        renderRoles();
        focusNewRow(id, '.cfg-name-input');
    }

    // Deleting just stages it (strikethrough + Undo) — the row isn't gone
    // for real until Save, matching every other pending change here.
    function removeRole(id) {
        if (id.startsWith('new-')) { delete roleChanges[id]; }
        else { roleDeletes.add(id); }
        markDirty('section-roles');
        renderRoles();
    }

    function undoRemoveRole(id) {
        roleDeletes.delete(id);
        markDirty('section-roles');
        renderRoles();
    }

    let roleDeletes = new Set();

    // ═══════════════════════════════════════════
    // Statuses
    // ═══════════════════════════════════════════
    async function loadStatuses() {
        const { data } = await supabaseClient.from('b-quest-status').select('*').order('sort_order');
        originalStatuses = data || [];
        renderStatuses();
    }

    function statusBuffer() {
        return originalStatuses.map(s => ({ ...s, ...(statusChanges[s.id] || {}), _deleted: statusDeletes.has(s.id) }))
            .concat(Object.entries(statusChanges).filter(([id]) => id.startsWith('new-')).map(([id, c]) => ({ id, ...c, _new: true })))
            .sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));
    }

    function statusConfigBuffer() {
        return { ...originalConfig, ...statusConfigChanges };
    }

    // There must always be exactly one Default — if none was ever set, or
    // the configured one got deleted/deactivated in this edit session, this
    // falls back to the first remaining eligible Status (sort_order'd,
    // same order shown in the list) rather than leaving no star lit.
    // Prefers an already-saved row (real id, can go straight into
    // default_status_id), but if NOTHING is saved yet — e.g. the very
    // first Status ever added — falls back to the first unsaved (new-*)
    // one instead, so it still shows starred; saveAll swaps in the real id
    // once that row is actually inserted (see there).
    function resolveDefaultStatusId(list) {
        const configured = statusConfigBuffer().default_status_id;
        const real = list.filter(s => !s._deleted && s.active !== false && !s._new);
        if (real.some(s => s.id === configured)) return configured;
        if (real.length) return real[0].id;
        const unsaved = list.filter(s => !s._deleted && s.active !== false && s._new);
        return unsaved[0]?.id ?? null;
    }

    function onSetDefaultStatus(id) {
        statusConfigChanges.default_status_id = id;
        markDirty('section-statuses');
        renderStatuses();
    }

    function renderStatuses() {
        const list = statusBuffer();
        document.getElementById('status-count').textContent = list.filter(s => !s._deleted).length;
        const container = document.getElementById('status-list');
        if (!list.length) { container.innerHTML = '<div class="cfg-empty">No statuses yet</div>'; return; }

        const defaultId = resolveDefaultStatusId(list);

        container.innerHTML = list.map((s, i) => `
            <div class="cfg-row ${s._new ? 'is-new' : ''} ${s._deleted ? 'is-deleted' : ''} ${s.active === false ? 'is-inactive' : ''}" data-id="${s.id}"
                 draggable="${!s._deleted}"
                 ondragstart="dragStart(event, 'status', '${s.id}')" ondragend="dragEnd(event)"
                 ondragover="event.preventDefault()" ondragenter="dragEnterRow(event, 'status', '${s.id}')" ondragleave="dragLeaveRow(event)"
                 ondrop="dropOnRow(event, 'status', '${s.id}')">
                <div class="cfg-drag-handle cfg-col-drag"><i class="bi bi-grip-vertical"></i></div>
                <div class="cfg-col-color"><div class="cfg-swatch" style="background:${s.color || '#94a3b8'}" onclick="openColorPicker(event, 'status', '${s.id}')"></div></div>
                <input class="cfg-name-input cfg-col-name" value="${esc(s.name)}" oninput="onStatusField('${s.id}', 'name', this.value)">
                <div class="cfg-col-star">
                    <button type="button" class="cfg-star-btn ${s.id === defaultId ? 'is-default' : ''}"
                        ${s._new || s._deleted || s.active === false ? 'disabled' : ''}
                        onclick="onSetDefaultStatus('${s.id}')"
                        title="${s.id === defaultId ? 'Default status for new tasks' : 'Set as default'}">
                        <i class="bi ${s.id === defaultId ? 'bi-star-fill' : 'bi-star'}"></i>
                    </button>
                </div>
                <div class="cfg-mini-toggle-wrap cfg-col-toggle">
                    <label class="bq-toggle small">
                        <input type="checkbox" ${s.active !== false ? 'checked' : ''} onchange="onStatusField('${s.id}', 'active', this.checked)">
                        <span class="bq-slider"></span>
                    </label>
                </div>
                <div class="cfg-flex-spacer cfg-col-trash">
                    ${s._deleted
                        ? `<button class="cfg-btn-undo" onclick="undoRemoveStatus('${s.id}')" title="Undo delete"><i class="bi bi-arrow-counterclockwise"></i></button>`
                        : `<button class="cfg-btn-del" onclick="removeStatus('${s.id}')" title="Delete"><i class="bi bi-trash3"></i></button>`}
                </div>
            </div>
        `).join('');
    }

    function onStatusField(id, field, value) {
        if (!statusChanges[id]) statusChanges[id] = {};
        statusChanges[id][field] = value;
        markDirty('section-statuses');
        if (field !== 'name') renderStatuses();

    function addStatus() {

        const buf = statusBuffer();
        const maxOrder = Math.max(0, ...buf.map(s => s.sort_order || 0));
        statusChanges[id] = { name: '', color: nextAutoColor(buf.map(s => s.color)), sort_order: maxOrder + 1, active: true };
        markDirty('section-statuses');
        renderStatuses();
        focusNewRow(id, '.cfg-name-input');
    }

    let statusDeletes = new Set();

    function removeStatus(id) {
        if (id.startsWith('new-')) { delete statusChanges[id]; }
        else { statusDeletes.add(id); }
        markDirty('section-statuses');

    function undoRemoveStatus(id) {

    }

    // ═══════════════════════════════════════════
    // Types
    // ═══════════════════════════════════════════
    async function loadTypes() {
        const { data } = await supabaseClient.from('b-quest-type').select('*').order('sort_order');
        originalTypes = data || [];
        renderTypes();

    function typeBuffer() {

            .concat(Object.entries(typeChanges).filter(([id]) => id.startsWith('new-')).map(([id, c]) => ({ id, ...c, _new: true })))
            .sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));

    function renderTypes() {

        const container = document.getElementById('type-list');
        if (!list.length) { container.innerHTML = '<div class="cfg-empty">No types yet</div>'; return; }

        container.innerHTML = list.map((t, i) => `

                 ondrop="dropOnRow(event, 'type', '${t.id}')">

    function onTypeField(id, field, value) {

    function addType() {

        const maxOrder = Math.max(0, ...typeBuffer().map(t => t.sort_order || 0));
        typeChanges[id] = { name: '', sort_order: maxOrder + 1, active: true };
        markDirty('section-types');
        renderTypes();

    let typeDeletes = new Set();

    function removeType(id) {

        markDirty('section-types');

    // ═══════════════════════════════════════════
    // Drag & drop reordering (Roles / Statuses / Types / Work — shared)
    // Reorder is only computed on "drop" (native DnD is fragile if the
    // dragged DOM node gets replaced mid-drag via innerHTML re-render);
    // dragenter/dragleave just toggle a highlight class, no re-render.
    // ═══════════════════════════════════════════
    let dragState = null; // { kind: 'role'|'status'|'work', id, roleId (work only) }

    function dragStart(e, kind, id, roleId) {
        dragState = { kind, id, roleId };
        e.currentTarget.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
    }

    function dragEnd(e) {
        e.currentTarget.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        dragState = null;
    }

    function dragEnterRow(e, kind, id, roleId) {
        if (!dragState || dragState.kind !== kind || dragState.id === id) return;
        if (kind === 'work' && dragState.roleId !== roleId) return;
        e.currentTarget.classList.add('drag-over');
    }

    function dragLeaveRow(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    function reorderList(list, fromId, toId) {
        const fromIdx = list.findIndex(x => x.id === fromId);
        const toIdx = list.findIndex(x => x.id === toId);
        if (fromIdx === -1 || toIdx === -1) return list;
        const [moved] = list.splice(fromIdx, 1);
        list.splice(toIdx, 0, moved);
        return list;
    }

    function dropOnRow(e, kind, id, roleId) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if (!dragState || dragState.kind !== kind || dragState.id === id) { dragState = null; return; }
        if (kind === 'work' && dragState.roleId !== roleId) { dragState = null; return; }

        if (kind === 'role') {
            const list = reorderList(roleBuffer(), dragState.id, id);
            list.forEach((r, i) => { (roleChanges[r.id] ||= {}).sort_order = i + 1; });
            markDirty('section-roles'); renderRoles();
        } else if (kind === 'status') {
            const list = reorderList(statusBuffer(), dragState.id, id);
            list.forEach((s, i) => { (statusChanges[s.id] ||= {}).sort_order = i + 1; });
            markDirty('section-statuses'); renderStatuses();
        } else if (kind === 'type') {
            const list = reorderList(typeBuffer(), dragState.id, id);
            list.forEach((t, i) => { (typeChanges[t.id] ||= {}).sort_order = i + 1; });
            markDirty('section-types'); renderTypes();
        } else if (kind === 'work') {
            const list = reorderList(workBuffer().filter(w => w.role_id === roleId), dragState.id, id);
            list.forEach((w, i) => { (workChanges[w.id] ||= {}).sort_order = i + 1; });
            markDirty('section-worklist'); renderWork();
        }
        dragState = null;
    }

    // One-click "reset to alphabetical" — reassigns sort_order by name,
    // staged like any other change (confirmed on Save, not immediate).
    function sortAlpha(kind) {
        const bufFn = { role: roleBuffer, status: statusBuffer, type: typeBuffer }[kind];
        const changesObj = { role: roleChanges, status: statusChanges, type: typeChanges }[kind];
        const sectionId = { role: 'section-roles', status: 'section-statuses', type: 'section-types' }[kind];
        const renderFn = { role: renderRoles, status: renderStatuses, type: renderTypes }[kind];
        if (!bufFn) return;

        const list = bufFn().filter(x => !x._deleted)
            .sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' }));
        list.forEach((item, i) => { (changesObj[item.id] ||= {}).sort_order = i + 1; });
        markDirty(sectionId);
        renderFn();
    }

    // Color / Icon pickers (separate — icon only applies to Roles)

    let pickerTarget = null; // { kind: 'role'|'status', id }

    function positionPicker(evt) {
        const panel = document.getElementById('picker-panel');
        const rect = evt.currentTarget.getBoundingClientRect();
        // .cfg-picker is absolutely positioned inside the fixed backdrop, so its
        // containing block is the viewport itself — use viewport-relative
        // coordinates from getBoundingClientRect() directly, no scroll offset.
        // Flip above the trigger (and cap height to whatever room actually
        // exists) when there isn't enough space below — a tall popup (e.g.
        // the column filter's sort+search+checklist) used to just render
        // past the bottom of the viewport with no way to reach the rest.
        const margin = 8;
        const spaceBelow = window.innerHeight - rect.bottom - margin;
        const spaceAbove = rect.top - margin;
        if (spaceBelow >= 200 || spaceBelow >= spaceAbove) {
            panel.style.top = (rect.bottom + 6) + 'px';
            panel.style.bottom = 'auto';
            panel.style.maxHeight = Math.max(150, spaceBelow - 6) + 'px';
        } else {
            panel.style.top = 'auto';
            panel.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
            panel.style.maxHeight = Math.max(150, spaceAbove - 6) + 'px';
        }
        panel.style.left = rect.left + 'px';
        document.getElementById('picker-backdrop').classList.add('show');
    }

    function openColorPicker(evt, kind, id) {

    function openIconPicker(evt, kind, id) {

    function renderIconGrid(icons, selectedIcon) {
        const grid = document.getElementById('picker-icon-grid');
        grid.innerHTML = icons.length
            ? icons.map(ic => `<div class="cfg-picker-icon ${selectedIcon === ic ? 'sel' : ''}" onclick="pickIcon('${ic}')"><i class="bi ${ic}"></i></div>`).join('')
            : '<div class="cfg-empty" style="grid-column:1/-1;">No icons found</div>';

    function filterIconGrid(q) {
        const ql = q.trim().toLowerCase();
        const filtered = ql ? ICON_PALETTE.filter(ic => ic.includes(ql)) : ICON_PALETTE;

    function closePicker() {
        document.getElementById('picker-backdrop').classList.remove('show');

    function applyColor(c) {
        if (!pickerTarget) return;
        const { kind, id } = pickerTarget;
        if (kind === 'role') onRoleField(id, 'color', c); else onStatusField(id, 'color', c);
    }

    function onColorWheelChange(value) {
        document.getElementById('picker-hex-input').value = value.toUpperCase();
        applyColor(value);
    }

    function onHexInputChange(value) {
        const hexInput = document.getElementById('picker-hex-input');
        const valid = /^#[0-9a-fA-F]{6}$/.test(value);
        hexInput.classList.toggle('invalid', !valid && value.length > 0);
        if (!valid) return;
        document.getElementById('picker-color-wheel').value = value;
        applyColor(value);
    }

    function pickIcon(ic) {
        if (!pickerTarget) return;
        onRoleField(pickerTarget.id, 'icon', ic);
        closePicker();

    // ═══════════════════════════════════════════
    // Work List (per role, dynamic)
    // ═══════════════════════════════════════════
    async function loadWork() {
        const { data } = await supabaseClient.from('b-quest-work').select('id, role_id, work, day, weight, max_per_day, sort_order').order('sort_order');
        originalWork = data || [];
        renderWork();
    }

    // ═══════════════════════════════════════════
    // Config (flat rule -> value bucket, global toggles)
    // ═══════════════════════════════════════════
    async function loadConfig() {
        const { data } = await supabaseClient.from('b-quest-config').select('rule, value');
        originalConfig = {};
        (data || []).forEach(row => { originalConfig[row.rule] = row.value; });
        renderWorkConfigToggles();
        renderWorkCalendar();
        renderNotifySection();
    }

    async function loadDepartments() {
        const { data } = await supabaseClient.from('departments').select('name').order('name');
        originalDepartments = (data || []).map(d => d.name);
    }

    function configBuffer() {
        return { ...originalConfig, ...configChanges };
    }

    function onConfigField(rule, value) {
        configChanges[rule] = value;
        markDirty('section-worklist');
        renderWorkConfigToggles();
        renderWork();
    }

    function renderWorkConfigToggles() {
        const el = document.getElementById('workConfigToggles');
        if (!el) return;
        const cfg = configBuffer();
        const item = (rule, label) => `
            <label class="wcfg-item">
                <span>${label}</span>
                <label class="bq-toggle small">
                    <input type="checkbox" ${cfg[rule] !== false ? 'checked' : ''} onchange="onConfigField('${rule}', this.checked)">
                    <span class="bq-slider"></span>
                </label>
            </label>`;
        el.innerHTML = item('work_day_enabled', 'Day') + item('work_max_enabled', 'Max');
    }

    // ═══════════════════════════════════════════
    // Work Calendar — how much of a day's capacity actually counts, per
    // weekday (0-100%). Feeds the same b-quest-config table as the Day/Max
    // toggles above but through its own staging bucket (calendarChanges),
    // so this box's dirty-dot and the Work List box's don't get confused
    // with each other's pending state.
    // ═══════════════════════════════════════════
    const WEEK_DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const WORKDAY_DEFAULT = { mon: 100, tue: 100, wed: 100, thu: 100, fri: 100, sat: 100, sun: 100 };

    function calendarConfigBuffer() {
        return { ...originalConfig, ...calendarChanges };
    }

    function renderWorkCalendar() {
        const cfg = calendarConfigBuffer();
        const weights = { ...WORKDAY_DEFAULT, ...(cfg.workday_weight || {}) };
        const mergeEl = document.getElementById('wc-merge-toggle-input');
        if (mergeEl) mergeEl.checked = cfg.merge_company_holidays === true;
        const list = document.getElementById('wc-day-list');
        if (!list) return;
        list.innerHTML = WEEK_DAYS.map(day => {
            const v = weights[day] ?? 100;
            return `
            <div class="wc-day-row ${v < 100 ? 'low' : ''} ${v === 0 ? 'zero' : ''}" data-day="${day}">
                <span class="wc-day-label">${day.toUpperCase()}</span>
                <input type="range" class="wc-slider" min="0" max="100" value="${v}" oninput="onWorkdayPctInput('${day}', this.value)">
                <div class="wc-pct-wrap">
                    <input type="number" class="wc-pct-input" min="0" max="100" value="${v}" oninput="onWorkdayPctInput('${day}', this.value)">
                    <span class="wc-pct-sign">%</span>
                </div>
            </div>`;
        }).join('');
    }

    // Direct DOM sync instead of a full renderWorkCalendar() — dragging the
    // slider fires this continuously, and replacing the row's DOM mid-drag
    // would drop the drag gesture (same reason name-input fields skip
    // re-rendering on every keystroke elsewhere on this page).
    function onWorkdayPctInput(day, rawValue) {
        const v = Math.max(0, Math.min(100, Math.round(Number(rawValue)) || 0));
        const cfg = calendarConfigBuffer();
        calendarChanges.workday_weight = { ...WORKDAY_DEFAULT, ...(cfg.workday_weight || {}), [day]: v };
        markDirty('section-calendar');
        const row = document.querySelector(`.wc-day-row[data-day="${day}"]`);
        if (row) {
            row.querySelector('.wc-slider').value = v;
            row.querySelector('.wc-pct-input').value = v;
            row.classList.toggle('low', v < 100);
            row.classList.toggle('zero', v === 0);
        }
    }

    // Inert until the company holiday list itself exists — staged and
    // saved like everything else here so it's already wired up and ready
    // the moment that feature lands, instead of needing this UI built then.
    function onMergeHolidaysToggle(checked) {
        calendarChanges.merge_company_holidays = checked;
        markDirty('section-calendar');
    }

    // ═══════════════════════════════════════════
    // Notifications & Email — settings only (which recipients a rule
    // resolves to). Turning those rules into an actual deduped send list
    // (matching codenames to real emails, collapsing the same person
    // reached via two different rules, etc.) is separate work for once
    // this is wired to real trigger events — not built here.
    // ═══════════════════════════════════════════
    const NOTIFY_ACTIONS = ['new', 'edit', 'delete', 'assign'];
    const NOTIFY_RULE_DEFAULT = { owner: false, leads: false, assignee: false, departments: [], codenames: [], exclude_codenames: [] };

    function notifyConfigBuffer() {
        return { ...originalConfig, ...notifyChanges };
    }

    function notifyRuleKey(action, channel) {
        return `${channel}_${action}`; // e.g. 'notify_new', 'email_delete'
    }

    function notifyRule(action, channel) {
        const raw = notifyConfigBuffer()[notifyRuleKey(action, channel)] || {};
        return {
            ...NOTIFY_RULE_DEFAULT, ...raw,
            departments: raw.departments || [],
            codenames: raw.codenames || [],
            exclude_codenames: raw.exclude_codenames || []
        };
    }

    function setNotifyRule(action, channel, rule) {
        notifyChanges[notifyRuleKey(action, channel)] = rule;
        markDirty('section-notify');
    }

    function toggleNotifyChannel(channel) {
        notifyChannel = channel;
        renderNotifySection();
    }

    function npBadge(text, removeCall) {
        return `<span class="np-badge">${esc(text)}<button type="button" onclick="${removeCall}" title="Remove"><i class="bi bi-x"></i></button></span>`;
    }

    function renderNotifySection() {
        const tabs = document.getElementById('notify-tabs');
        if (tabs) tabs.querySelectorAll('.np-tab').forEach(b => b.classList.toggle('active', b.dataset.channel === notifyChannel));
        const list = document.getElementById('notify-rows');
        if (!list) return;
        list.innerHTML = NOTIFY_ACTIONS.map(action => renderNotifyRow(action, notifyChannel)).join('');
    }

    function renderNotifyRow(action, channel) {
        const rule = notifyRule(action, channel);
        let badges = '';
        if (rule.owner) badges += npBadge('Owner', `toggleNotifyFlag('${action}','${channel}','owner',false)`);
        if (rule.leads) badges += npBadge('Leads', `toggleNotifyFlag('${action}','${channel}','leads',false)`);
        if (rule.assignee) badges += npBadge('Assignee', `toggleNotifyFlag('${action}','${channel}','assignee',false)`);
        rule.departments.forEach(d => badges += npBadge(d, `toggleNotifyDept('${action}','${channel}','${esc(d)}',false)`));
        rule.codenames.forEach(c => badges += npBadge(c, `toggleNotifyCodename('${action}','${channel}','${esc(c)}',false,false)`));
        let exBadges = '';
        rule.exclude_codenames.forEach(c => exBadges += npBadge(c, `toggleNotifyCodename('${action}','${channel}','${esc(c)}',false,true)`));
        return `
        <div class="np-row">
            <div class="np-row-head">${action.toUpperCase()}</div>
            <div class="np-badges">${badges}<button type="button" class="cfg-btn-add hover-scale" onclick="openNotifyRecipientPicker(event,'${action}','${channel}')"><i class="bi bi-plus-lg"></i> Add</button></div>
            <div class="np-without-row">
                <span class="np-without-label">Without</span>
                ${exBadges}
                <button type="button" class="np-without-add" onclick="openNotifyExcludePicker(event,'${action}','${channel}')"><i class="bi bi-plus"></i> Add</button>
            </div>
        </div>`;
    }

    function toggleNotifyFlag(action, channel, flag, checked) {
        const rule = notifyRule(action, channel);
        setNotifyRule(action, channel, { ...rule, [flag]: checked });
        renderNotifySection();
    }

    function toggleNotifyDept(action, channel, dept, checked) {
        const rule = notifyRule(action, channel);
        const departments = new Set(rule.departments);
        checked ? departments.add(dept) : departments.delete(dept);
        setNotifyRule(action, channel, { ...rule, departments: [...departments] });
        renderNotifySection();
    }

    function toggleNotifyCodename(action, channel, codename, checked, isExclude) {
        const rule = notifyRule(action, channel);
        const field = isExclude ? 'exclude_codenames' : 'codenames';
        const set = new Set(rule[field]);
        checked ? set.add(codename) : set.delete(codename);
        setNotifyRule(action, channel, { ...rule, [field]: [...set] });
        renderNotifySection();
    }

    // "Add recipient" — Owner/Leads/Assignee as quick checkboxes (fixed,
    // no search needed) plus Department and Codename as searchable lists.
    function openNotifyRecipientPicker(evt, action, channel) {
        pickerTarget = { kind: 'notify-add', action, channel };
        const rule = notifyRule(action, channel);
        const panel = document.getElementById('picker-panel');
        panel.classList.remove('medium');
        panel.classList.add('wide');
        panel.innerHTML = `
            <div class="cfg-picker-label">Quick</div>
            <div class="np-quick-row">
                <label class="np-quick-chip"><input type="checkbox" class="modern-checkbox" ${rule.owner ? 'checked' : ''} onchange="toggleNotifyFlag('${action}','${channel}','owner',this.checked)"> Owner</label>
                <label class="np-quick-chip"><input type="checkbox" class="modern-checkbox" ${rule.leads ? 'checked' : ''} onchange="toggleNotifyFlag('${action}','${channel}','leads',this.checked)"> Leads</label>
                <label class="np-quick-chip"><input type="checkbox" class="modern-checkbox" ${rule.assignee ? 'checked' : ''} onchange="toggleNotifyFlag('${action}','${channel}','assignee',this.checked)"> Assignee</label>
            </div>
            ${originalDepartments.length ? `
            <div class="cfg-picker-label">Department</div>
            <div class="np-scroll-list">
                ${originalDepartments.map(d => `<label class="np-list-item"><input type="checkbox" class="modern-checkbox" ${rule.departments.includes(d) ? 'checked' : ''} onchange="toggleNotifyDept('${action}','${channel}','${esc(d)}',this.checked)"> ${esc(d)}</label>`).join('')}
            </div>` : ''}
            <div class="cfg-picker-label">Codename</div>
            <input type="text" class="cfg-icon-search" id="np-codename-search" placeholder="Search..." oninput="renderNotifyCodenameList(this.value)">
            <div class="np-scroll-list" id="np-codename-list"></div>
        `;
        renderNotifyCodenameList('');
        positionPicker(evt);
    }

    // "Without" — codename only (excluding by whole department/role isn't
    // the use case; it's always "this one specific person, regardless of
    // which broad rule would otherwise catch them").
    function openNotifyExcludePicker(evt, action, channel) {
        pickerTarget = { kind: 'notify-exclude', action, channel };
        const panel = document.getElementById('picker-panel');
        panel.classList.remove('wide');
        panel.classList.add('medium');
        panel.innerHTML = `
            <div class="cfg-picker-label">Exclude Codename</div>
            <input type="text" class="cfg-icon-search" id="np-codename-search" placeholder="Search..." oninput="renderNotifyCodenameList(this.value)">
            <div class="np-scroll-list" id="np-codename-list"></div>
        `;
        renderNotifyCodenameList('');
        positionPicker(evt);
    }

    function renderNotifyCodenameList(q) {
        const { action, channel, kind } = pickerTarget || {};
        if (!action) return;
        const isExclude = kind === 'notify-exclude';
        const rule = notifyRule(action, channel);
        const selected = new Set(isExclude ? rule.exclude_codenames : rule.codenames);
        const ql = q.trim().toLowerCase();
        const list = allProfiles.filter(p => !ql || p.codename.toLowerCase().includes(ql));
        const el = document.getElementById('np-codename-list');
        if (!el) return;
        el.innerHTML = list.length ? list.map(p => `
            <label class="np-list-item"><input type="checkbox" class="modern-checkbox" ${selected.has(p.codename) ? 'checked' : ''} onchange="toggleNotifyCodename('${action}','${channel}','${esc(p.codename)}',this.checked,${isExclude})"> ${esc(p.codename)}</label>
        `).join('') : '<div class="cfg-empty">No matches</div>';
    }

    function workBuffer() {
        return originalWork.map(w => ({ ...w, ...(workChanges[w.id] || {}), _deleted: workDeletes.has(w.id) }))
            .concat(Object.entries(workChanges).filter(([id]) => id.startsWith('new-')).map(([id, c]) => ({ id, ...c, _new: true })));
    }

    let workDeletes = new Set();

    function renderWork() {
        const container = document.getElementById('work-cols');
        const roles = roleBuffer().filter(r => r.active !== false && !r._deleted);
        const cfg = configBuffer();
        const dayOn = cfg.work_day_enabled !== false;
        const maxOn = cfg.work_max_enabled !== false;
        container.classList.remove('count-1', 'count-2', 'cfg-no-day', 'cfg-no-max');
        if (roles.length === 1) container.classList.add('count-1');
        else if (roles.length === 2) container.classList.add('count-2');
        if (!dayOn) container.classList.add('cfg-no-day');
        if (!maxOn) container.classList.add('cfg-no-max');
        if (!roles.length) { container.innerHTML = '<div class="work-empty">Add a role above first.</div>'; return; }

        const buf = workBuffer();

        container.innerHTML = roles.map(r => {
            const items = buf.filter(w => w.role_id === r.id).sort((a, b) => (a.sort_order ?? 999) - (b.sort_order ?? 999));
            return `
            <div class="work-col">
                <div class="work-col-header" style="background:${r.color}22; border-color:${r.color}55;">
                    <div class="work-col-title-group">
                        <div class="work-col-title" style="color:${r.color}"><i class="bi ${r.icon || 'bi-person-workspace'}"></i> ${esc(r.name) || 'Untitled'}</div>

                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <button class="work-col-sort" onclick="sortWorkAlpha('${r.id}')" title="Sort A-Z"><i class="bi bi-sort-alpha-down"></i></button>
                        <button class="btn-add-work hover-scale" style="background:${r.color}" onclick="addWork('${r.id}')"><i class="bi bi-plus-lg"></i> Add</button>
                    </div>
                </div>
                <div class="work-col-inner">
                    <div class="work-col-subhead">
                        <span></span><span>Work Name</span><span style="text-align:center;">Weight</span>${dayOn ? '<span style="text-align:center;">Day</span>' : ''}${maxOn ? '<span style="text-align:center;" class="work-col-divider">Max</span>' : ''}<span></span>
                    </div>
                    ${items.length ? items.map((w, i) => `
                        <div class="work-row ${w._new ? 'is-new' : ''} ${w._deleted ? 'is-deleted' : ''}" data-id="${w.id}"
                             draggable="${!w._deleted}"
                             ondragstart="dragStart(event, 'work', '${w.id}', '${r.id}')" ondragend="dragEnd(event)"
                             ondragover="event.preventDefault()" ondragenter="dragEnterRow(event, 'work', '${w.id}', '${r.id}')" ondragleave="dragLeaveRow(event)"
                             ondrop="dropOnRow(event, 'work', '${w.id}', '${r.id}')">
                            <div class="work-drag-handle"><i class="bi bi-grip-vertical"></i></div>
                            <input class="work-input" value="${esc(w.work)}" oninput="onWorkField('${w.id}', 'work', this.value)">
                            <input class="work-weight" type="number" step="0.01" value="${w.weight ?? ''}" oninput="onWorkField('${w.id}', 'weight', this.value === '' ? null : parseFloat(this.value))">
                            ${dayOn ? `<input class="work-weight" type="text" value="${esc(w.day ?? 1)}" oninput="onWorkField('${w.id}', 'day', this.value)">` : ''}
                            ${maxOn ? `<input class="work-weight work-col-divider" type="text" inputmode="decimal" value="${w.max_per_day == null ? '-' : w.max_per_day}" oninput="onWorkField('${w.id}', 'max_per_day', parseMaxPerDay(this.value))">` : ''}
                            ${w._deleted
                                ? `<button class="cfg-btn-undo" onclick="undoRemoveWork('${w.id}')" title="Undo delete"><i class="bi bi-arrow-counterclockwise"></i></button>`
                                : `<button class="btn-work-del" onclick="removeWork('${w.id}')" title="Delete"><i class="bi bi-trash3"></i></button>`}
                        </div>
                    `).join('') : '<div class="work-empty">No items yet</div>'}
                </div>
            </div>`;
        }).join('');
    }

    function onWorkField(id, field, value) {
        if (!workChanges[id]) workChanges[id] = {};
        workChanges[id][field] = value;
        markDirty('section-worklist');
    }

    // "-" (or blank) means unlimited (stored as null); anything else parses
    // as the per-day cap. Typos/non-numeric text also fall back to null
    // rather than throwing, since this field has no strict format.
    function parseMaxPerDay(raw) {
        const v = (raw ?? '').toString().trim();
        if (v === '' || v === '-' || v === '−') return null;
        const n = parseFloat(v);
        return isNaN(n) ? null : n;
    }

    function addWork(roleId) {
        const id = `new-${roleIdSeq--}`;
        const items = workBuffer().filter(w => w.role_id === roleId && !w._deleted);
        const maxOrder = Math.max(0, ...items.map(w => w.sort_order || 0));
        workChanges[id] = { role_id: roleId, work: '', day: '1', weight: 1, max_per_day: null, sort_order: maxOrder + 1 };
        markDirty('section-worklist');
        renderWork();
        focusNewRow(id, '.work-input');
    }

    function removeWork(id) {
        if (id.startsWith('new-')) { delete workChanges[id]; }
        else { workDeletes.add(id); }
        markDirty('section-worklist');
        renderWork();
    }

    function undoRemoveWork(id) {
        workDeletes.delete(id);
        markDirty('section-worklist');
        renderWork();
    }

    // Same "reset to alphabetical" as sortAlpha(), but scoped to one role's
    // work column (work items are grouped by role, not a flat list).
    function sortWorkAlpha(roleId) {
        const list = workBuffer().filter(w => w.role_id === roleId && !w._deleted)
            .sort((a, b) => (a.work || '').localeCompare(b.work || '', undefined, { sensitivity: 'base' }));
        list.forEach((item, i) => { (workChanges[item.id] ||= {}).sort_order = i + 1; });
        markDirty('section-worklist');
        renderWork();
    }

    // ═══════════════════════════════════════════
    // Save All (Roles / Statuses / Work List)
    // ═══════════════════════════════════════════
    // Insert new / update existing / delete removed rows for one table.
    // Skips the UPDATE call entirely for rows also marked for deletion —
    // they're about to be deleted anyway, no point writing to them first.
    // Returns a temp-id -> real-id map for whatever got inserted, so a
    // caller that staged something referencing a 'new-N' id (e.g. Status's
    // default_status_id) can swap in the row's actual id afterward.
    async function saveTable(table, changes, deletes, requiredField, errors, label) {
        const idMap = {};
        for (const [id, ch] of Object.entries(changes)) {
            if (deletes.has(id)) continue;
            if (id.startsWith('new-')) {
                if (!ch[requiredField]?.trim()) continue;
                const { data, error } = await supabaseClient.from(table).insert([{ ...ch, [requiredField]: ch[requiredField].trim() }]).select().single();
                if (error) errors.push(`${label} add "${ch[requiredField]}": ` + error.message);
                else if (data) idMap[id] = data.id;
            } else {
                const { error } = await supabaseClient.from(table).update(ch).eq('id', id);
                if (error) errors.push(`${label} update: ` + error.message);
            }
        }
        for (const id of deletes) {
            const { error } = await supabaseClient.from(table).delete().eq('id', id);
            if (error) {
                // 23503 = foreign key violation — this row (Role/Status) is
                // still referenced by existing tasks. The raw Postgres
                // message is unreadable to a non-technical user; the delete
                // is safely blocked either way (nothing is lost), so just
                // explain the actual reason and the way out.
                errors.push(error.code === '23503'
                    ? `Cannot Delete: ${label} is used by existing tasks. Deactivate it instead.`
                    : `${label} delete: ` + error.message);
            }
        }
        return idMap;
    }

    async function saveAll() {
        try {
            const errors = [];
            const roleIdMap = await saveTable('b-quest-role', roleChanges, roleDeletes, 'name', errors, 'Role');
            // A brand-new Role's Work items / Member grants staged in this
            // SAME save still reference its temp 'new-N' id — swap in the
            // real one now that saveTable above actually inserted it,
            // otherwise their own insert fails (invalid uuid). Also drop
            // those temp ids from roleChanges itself: they're now safely
            // represented by the real reloaded row, so leaving them staged
            // would show the role twice if some LATER step in this same
            // save fails (the error path reloads from DB but never clears
            // already-succeeded entries out of the change buffers).
            Object.values(workChanges).forEach(ch => { if (ch.role_id?.startsWith?.('new-')) ch.role_id = roleIdMap[ch.role_id] || ch.role_id; });
            Object.values(memberRoleChanges).forEach(ch => { if (ch.role_id?.startsWith?.('new-')) ch.role_id = roleIdMap[ch.role_id] || ch.role_id; });
            Object.keys(roleIdMap).forEach(tempId => delete roleChanges[tempId]);

            const statusIdMap = await saveTable('b-quest-status', statusChanges, statusDeletes, 'name', errors, 'Status');
            await saveTable('b-quest-type', typeChanges, typeDeletes, 'name', errors, 'Type');
            await saveTable('b-quest-work', workChanges, workDeletes, 'work', errors, 'Work');

            // Force exactly one Default — if the configured one is no
            // longer valid (deleted/deactivated this session) or was never
            // set, persist the resolved fallback so the DB itself always
            // has an explicit value, not just the UI's live display guess.
            // The resolved id can be a still-unsaved 'new-N' row (e.g. the
            // very first Status ever added) — swap in its real id, now that
            // saveTable above has actually inserted it.
            let resolvedStatusDefault = resolveDefaultStatusId(statusBuffer());
            if (resolvedStatusDefault && resolvedStatusDefault.startsWith('new-')) {
                resolvedStatusDefault = statusIdMap[resolvedStatusDefault] || null;
            }
            if (resolvedStatusDefault && resolvedStatusDefault !== statusConfigBuffer().default_status_id) {
                statusConfigChanges.default_status_id = resolvedStatusDefault;
            }

            for (const [rule, value] of Object.entries({ ...configChanges, ...statusConfigChanges, ...calendarChanges, ...notifyChanges })) {
                const { error } = await supabaseClient.from('b-quest-config').upsert({ rule, value });
                if (error) errors.push('Settings update: ' + error.message);
            }

            // Members — keyed by codename (the real PK) rather than a
            // synthetic id, so this can't reuse the generic saveTable()
            // insert/'new-' convention; a member is "new" simply if its
            // codename isn't in originalMembers yet.
            for (const [codename, ch] of Object.entries(memberChanges)) {
                if (memberDeletes.has(codename)) continue;
                const isNewMember = !originalMembers.some(m => m.codename === codename);
                const { error } = isNewMember
                    ? await supabaseClient.from('b-quest-member').insert([{ codename, permissions: ch.permissions || [] }])
                    : await supabaseClient.from('b-quest-member').update(ch).eq('codename', codename);
                if (error) errors.push(`Member "${codename}": ` + error.message);
            }
            for (const codename of memberDeletes) {
                const { error } = await supabaseClient.from('b-quest-member').delete().eq('codename', codename);
                if (error) errors.push(`Member remove "${codename}": ` + error.message);
            }
            await saveTable('b-quest-member-role', memberRoleChanges, memberRoleDeletes, 'codename', errors, 'Member Role');

            if (errors.length) {
                // Something failed partway through — keep everything staged
                // (including whatever DID succeed, since re-saving those
                // rows again is harmless) so the user can fix and retry
                // instead of silently losing unsaved work.
                const allCannotDelete = errors.every(e => e.startsWith('Cannot Delete:'));
                const title = allCannotDelete ? 'Cannot Delete' : 'Some errors occurred';
                const body = allCannotDelete ? errors.map(e => e.replace('Cannot Delete: ', '')).join('\n') : errors.join('\n');
                Swal.fire(title, body, 'error');
                await Promise.all([loadRoles(), loadStatuses(), loadTypes(), loadConfig()]);
                await Promise.all([loadWork(), loadMembers()]);
                return;
            }

            Swal.fire({ icon: 'success', title: 'Saved!', showConfirmButton: false, timer: 1200 });
            clearDirty();
            await Promise.all([loadRoles(), loadStatuses(), loadTypes(), loadConfig()]);
            await Promise.all([loadWork(), loadMembers()]); // roles feed both

        } catch (e) {
            Swal.fire('Error', e.message, 'error');
        }
    }

    // ═══════════════════════════════════════════
    // Members & Permissions — staged like everything else on this page:
    // grant/revoke a role is a direct toggle in the matrix (one click,
    // immediately shown live), and the fine-grained per-role permissions
    // (new/edit/delete/assign) live behind a small ⚙ popover next to the
    // toggle rather than a separate modal — nothing hits the DB until Save.
    // ═══════════════════════════════════════════
    function showSkeleton() {
        const row = () => `<div class="skeleton-row"><div class="skeleton-block" style="height:30px;width:130px;"></div><div class="skeleton-block" style="height:24px;width:200px;"></div></div>`;
        document.getElementById('mem-list').innerHTML = row() + row() + row();
    }

    async function loadMembers() {
        showSkeleton();
        const [{ data: members, error }, { data: memberRoles }] = await Promise.all([
            supabaseClient.from('b-quest-member').select('codename, permissions').order('codename'),
            supabaseClient.from('b-quest-member-role').select('id, codename, role_id, new, edit, delete, accept, assign, edit_scope, delete_scope')
        ]);
        if (error) { console.error(error); return; }
        originalMembers = members || [];
        originalMemberRoles = memberRoles || [];
        renderMembers();
    }

    async function loadAllProfiles() {
        const { data } = await supabaseClient.from('profiles').select('codename, nick_name, full_name, employee_id, department, level').neq('level', 'god').order('codename');
        allProfiles = data || [];
    }

    function profileFor(codename) {
        return allProfiles.find(p => p.codename === codename);
    }

    // ── Excel-style column header filter (Member/Code/Department): sort
    // A-Z/Z-A + a searchable checklist of that column's distinct values.
    // A centered modal rather than an anchored popover (like the color/icon
    // pickers) — this one has enough content (sort + search + scrollable
    // checklist + actions) that it reads better as its own dialog, and it
    // sidesteps the "not enough room below the trigger" problem entirely.
    // Scoped to members actually on this project (memberBuffer), not every
    // profile in the system — a profile can exist without being added here
    // yet, and the filter checklist shouldn't offer values that can't
    // actually match any row in the table.
    function columnValues(field) {
        return [...new Set(memberBuffer().filter(m => !m._deleted).map(m => profileFor(m.codename)?.[field]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    }

    function filterIcon(field) {
        const active = !!memberColumnFilters[field];
        return `<i class="bi ${active ? 'bi-funnel-fill' : 'bi-funnel'} mem-filter-icon ${active ? 'active' : ''}"></i>`;
    }

    // Small, quiet echo of the row-level ⚡ button so both axes read as the
    // same "bulk toggle" language — deliberately not a big filled button
    // here, the action columns are already tight on width (fits "DELETE"/
    // "ASSIGN" as it is).
    function bulkColIcon() {
        return '<i class="bi bi-lightning-charge-fill mem-bulk-col-icon"></i>';
    }

    function openColumnFilterPopup(field, label) {
        filterPopupField = field;
        document.getElementById('mem-filter-title').textContent = label;
        document.getElementById('mem-filter-search').value = '';
        toggleSearchClearBtn('');
        renderColumnFilterList('');
        document.getElementById('mem-filter-overlay').classList.add('show');
        setTimeout(() => document.getElementById('mem-filter-search').focus(), 100);
    }

    function closeColumnFilterPopup(e) {
        if (e && e.target !== document.getElementById('mem-filter-overlay')) return;
        document.getElementById('mem-filter-overlay').classList.remove('show');
    }

    function toggleSearchClearBtn(val) {
        const btn = document.getElementById('mem-filter-search-clear');
        if (btn) btn.style.display = val ? 'flex' : 'none';
    }

    function clearColumnFilterSearch() {
        const input = document.getElementById('mem-filter-search');
        input.value = '';
        input.focus();
        toggleSearchClearBtn('');
        renderColumnFilterList('');
    }

    // Only touches #mem-filter-list, never the outer panel/search input —
    // same reason as renderIconGrid/filterIconGrid: replacing the search
    // input itself via innerHTML on every keystroke would drop its focus.
    function renderColumnFilterList(searchQ) {
        const field = filterPopupField;
        const all = columnValues(field);
        const ql = searchQ.trim().toLowerCase();
        const visible = ql ? all.filter(v => v.toLowerCase().includes(ql)) : all;
        const selected = memberColumnFilters[field]; // null = everything counts as checked
        const list = document.getElementById('mem-filter-list');

        // Header info (count + Reset prominence) reflects the field's real
        // filter state, not the momentary search — computed up front so it
        // still updates even when the search matches nothing below.
        const selectedTotal = selected ? selected.size : all.length;
        document.getElementById('mem-filter-count').textContent = selectedTotal === all.length ? '' : `${selectedTotal}/${all.length} selected`;
        document.getElementById('mem-filter-reset-btn')?.classList.toggle('active', !!selected);

        if (!visible.length) { list.innerHTML = '<div class="cfg-empty">No matches</div>'; return; }
        const checkedCount = visible.filter(v => !selected || selected.has(v)).length;
        list.innerHTML = `
            <label class="mem-filter-item mem-filter-select-all">
                <input type="checkbox" class="modern-checkbox" id="mem-filter-select-all-cb" ${checkedCount === visible.length ? 'checked' : ''} onchange="toggleAllVisible(this.checked)">
                <span>Select All${ql ? ` (${visible.length} matching)` : ''}</span>
            </label>
            ${visible.map(v => `
            <label class="mem-filter-item">
                <input type="checkbox" class="modern-checkbox" ${!selected || selected.has(v) ? 'checked' : ''} onchange="toggleColumnValue('${esc(v)}', this.checked)">
                <span>${esc(v)}</span>
            </label>`).join('')}
        `;
        const selectAllCb = document.getElementById('mem-filter-select-all-cb');
        if (selectAllCb) selectAllCb.indeterminate = checkedCount > 0 && checkedCount < visible.length;
    }

    function toggleColumnValue(value, checked) {
        const field = filterPopupField;
        if (memberColumnFilters[field] === null) memberColumnFilters[field] = new Set(columnValues(field));
        checked ? memberColumnFilters[field].add(value) : memberColumnFilters[field].delete(value);
        if (memberColumnFilters[field].size === columnValues(field).length) memberColumnFilters[field] = null; // back to "no filter"
        renderMembers(currentMemberFilter());
        renderColumnFilterList(document.getElementById('mem-filter-search')?.value || '');
    }

    // Scoped to whatever the search currently narrows the list to — checking
    // it only affects the visible rows; anything hidden by the search keeps
    // whatever state it already had, same as Excel/Sheets' filter dropdown.
    function toggleAllVisible(checked) {
        const field = filterPopupField;
        const ql = (document.getElementById('mem-filter-search')?.value || '').trim().toLowerCase();
        const all = columnValues(field);
        const visible = ql ? all.filter(v => v.toLowerCase().includes(ql)) : all;
        if (memberColumnFilters[field] === null) memberColumnFilters[field] = new Set(all);
        visible.forEach(v => checked ? memberColumnFilters[field].add(v) : memberColumnFilters[field].delete(v));
        if (memberColumnFilters[field].size === all.length) memberColumnFilters[field] = null;
        renderMembers(currentMemberFilter());
        renderColumnFilterList(document.getElementById('mem-filter-search')?.value || '');
    }

    // The one action that ignores the search entirely — a full reset back
    // to "no filter, everyone shown", distinct from the in-list Select All
    // which only ever touches the currently-searched subset.
    function resetColumnFilter() {
        memberColumnFilters[filterPopupField] = null;
        document.getElementById('mem-filter-search').value = '';
        toggleSearchClearBtn('');
        renderMembers(currentMemberFilter());
        renderColumnFilterList('');
    }

    function setMemberSortDirect(field, dir) {
        memberSort = { field, dir };
        closeColumnFilterPopup();
        renderMembers(currentMemberFilter());
    }

    function memberBuffer() {
        return originalMembers.map(m => ({ ...m, ...(memberChanges[m.codename] || {}), _deleted: memberDeletes.has(m.codename) }))
            .concat(Object.entries(memberChanges)
                .filter(([codename]) => !originalMembers.some(m => m.codename === codename))
                .map(([codename, c]) => ({ codename, permissions: [], ...c, _new: true })));
    }

    function memberRoleBuffer() {
        return originalMemberRoles.map(mr => ({ ...mr, ...(memberRoleChanges[mr.id] || {}), _deleted: memberRoleDeletes.has(mr.id) }))
            .concat(Object.entries(memberRoleChanges).filter(([id]) => id.startsWith('new-')).map(([id, c]) => ({ id, ...c, _new: true })));
    }

    // Search text + column-checklist filters combined — the single source of
    // truth for "which members are on screen right now", used both to render
    // the table and to scope Advanced Mode's bulk toggles to what's visible.
    function visibleMemberRows(filter) {
        let rows = memberBuffer();
        if (filter) {
            const fl = filter.toLowerCase();
            rows = rows.filter(m => {
                const p = profileFor(m.codename);
                return m.codename.toLowerCase().includes(fl)
                    || (p?.nick_name || '').toLowerCase().includes(fl)
                    || (p?.full_name || '').toLowerCase().includes(fl)
                    || (p?.employee_id || '').toLowerCase().includes(fl)
                    || (p?.department || '').toLowerCase().includes(fl);
            });
        }
        for (const field of Object.keys(memberColumnFilters)) {
            const allowed = memberColumnFilters[field];
            if (allowed) rows = rows.filter(m => allowed.has(profileFor(m.codename)?.[field]));
        }
        return rows;
    }

    function renderMembers(filter = '') {
        const container = document.getElementById('mem-list');
        const roles = roleBuffer().filter(r => r.active !== false && !r._deleted);
        const allRows = memberBuffer();
        let rows = visibleMemberRows(filter);

        const liveTotal = allRows.filter(m => !m._deleted).length;
        updateTableCount(rows.filter(m => !m._deleted).length, liveTotal);

        // Deliberately NOT an early-return-with-different-markup here: that
        // used to replace the whole table (colgroup+thead included) with a
        // plain "No members found" div whenever a filter matched nothing —
        // which also wiped out the column header filter controls themselves,
        // leaving no way to click back in and clear the filter that caused
        // the empty result. The header must always render; only the body
        // rows are conditional.
        rows = [...rows].sort((a, b) => {
            const va = (profileFor(a.codename)?.[memberSort.field] || '').toLowerCase();
            const vb = (profileFor(b.codename)?.[memberSort.field] || '').toLowerCase();
            const cmp = va.localeCompare(vb);
            return memberSort.dir === 'asc' ? cmp : -cmp;
        });

        const grantsBuf = memberRoleBuffer();

        // Under table-layout:fixed, only <colgroup>/<col> reliably drives
        // column widths when a grouped header (colspan) sits above individual
        // sub-columns — a width on the th itself is ignored once it's not in
        // the table's first row (learned the hard way: three rounds of
        // "widen the th, nothing moves" before landing here). One <col> per
        // real column, independent of how the header rows group/span them.
        const ACTION_COL_PX = 75;
        container.innerHTML = `
        <table class="mem-matrix">
            <colgroup>
                <col style="width:40px">
                <col style="width:200px">
                <col style="width:80px">
                <col style="width:190px">
                ${advancedMode ? '<col style="width:44px">' : ''}
                <col style="width:90px">
                <col style="width:90px">
                <col style="width:90px">
                <col style="width:90px">
                ${roles.map(() => PERM_COLS.map(() => `<col style="width:${ACTION_COL_PX}px">`).join('')).join('')}
            </colgroup>
            <thead>
                <tr>
                    <th class="mem-col-trash" rowspan="2"></th>
                    <th class="mem-col-name mem-header-filterable" rowspan="2" onclick="openColumnFilterPopup('nick_name', 'Member')">Member ${sortIcon('nick_name')} ${filterIcon('nick_name')}</th>
                    <th class="mem-col-code mem-header-filterable" rowspan="2" onclick="openColumnFilterPopup('employee_id', 'Code')">Code ${sortIcon('employee_id')} ${filterIcon('employee_id')}</th>
                    <th class="mem-col-dept mem-header-filterable" rowspan="2" onclick="openColumnFilterPopup('department', 'Department')">Department ${sortIcon('department')} ${filterIcon('department')}</th>
                    ${advancedMode ? `<th class="mem-col-bulk-row" rowspan="2" title="Bulk toggle: click a row's icon to enable/disable everything for that member"><i class="bi bi-lightning-charge-fill" style="color:#f59e0b"></i></th>` : ''}
                    <th class="mem-col-dashboard mem-zone-divider ${advancedMode ? 'mem-col-adv' : ''}" rowspan="2"${advancedMode ? ` onclick="bulkToggleFlag('dashboard')" title="Click to toggle Dashboard access for everyone shown"` : ''}>Dashboard${advancedMode ? bulkColIcon() : ''}</th>
                    <th class="mem-col-settings ${advancedMode ? 'mem-col-adv' : ''}" rowspan="2"${advancedMode ? ` onclick="bulkToggleFlag('setting')" title="Click to toggle Settings access for everyone shown"` : ''}>Settings${advancedMode ? bulkColIcon() : ''}</th>
                    <th class="mem-col-duplicate mem-zone-divider ${advancedMode ? 'mem-col-adv' : ''}" rowspan="2"${advancedMode ? ` onclick="bulkToggleFlag('duplicate')" title="Click to toggle Duplicate access for everyone shown"` : ''}>Duplicate${advancedMode ? bulkColIcon() : ''}</th>
                    <th class="mem-col-share ${advancedMode ? 'mem-col-adv' : ''}" rowspan="2"${advancedMode ? ` onclick="bulkToggleFlag('share')" title="Click to toggle Share access for everyone shown"` : ''}>Share${advancedMode ? bulkColIcon() : ''}</th>
                    ${roles.map(r => {
                        const attrs = advancedMode ? ` onclick="bulkToggleRole('${r.id}')" title="Click to toggle all of ${esc(r.name)}'s permissions for everyone shown"` : '';
                        return `<th class="mem-role-group-head ${advancedMode ? 'mem-col-adv' : ''}" colspan="${PERM_COLS.length}" style="color:${r.color}"${attrs}><i class="bi ${r.icon || 'bi-person-workspace'}"></i>${esc(r.name)}${advancedMode ? bulkColIcon() : ''}</th>`;
                    }).join('')}
                </tr>
                <tr>
                    ${roles.map(r => PERM_COLS.map((col, i) => {
                        const label = col.charAt(0).toUpperCase() + col.slice(1);
                        const cls = `mem-col-action ${i === 0 ? 'mem-group-start' : ''} ${advancedMode ? 'mem-col-adv' : ''}`;
                        const attrs = advancedMode ? ` onclick="bulkToggleColumn('${r.id}','${col}')" title="Click to toggle ${label} for everyone shown"` : ` title="${label}"`;
                        return `<th class="${cls}"${attrs}>${label}${advancedMode ? bulkColIcon() : ''}</th>`;
                    }).join('')).join('')}
                </tr>
            </thead>
            <tbody>
                ${!rows.length ? `
                <tr>
                    <td colspan="${8 + (advancedMode ? 1 : 0) + roles.length * PERM_COLS.length}" class="mem-empty-row">
                        <i class="bi bi-people"></i> No Member
                    </td>
                </tr>` : rows.map(member => {
                    const hasSetting = (member.permissions || []).includes('setting');
                    const hasDashboard = (member.permissions || []).includes('dashboard');
                    const hasDuplicate = (member.permissions || []).includes('duplicate');
                    const hasShare = (member.permissions || []).includes('share');
                    const grants = grantsBuf.filter(g => g.codename === member.codename && !g._deleted);
                    const p = profileFor(member.codename);
                    return `
                    <tr class="${member._new ? 'is-new' : ''} ${member._deleted ? 'is-deleted' : ''}" data-codename="${esc(member.codename)}">
                        <td class="mem-col-trash">
                            ${member._deleted
                                ? `<button class="cfg-btn-undo" onclick="undoRemoveMember('${esc(member.codename)}')" title="Undo delete"><i class="bi bi-arrow-counterclockwise"></i></button>`
                                : `<button class="btn-remove" onclick="removeMember('${esc(member.codename)}')" title="Remove"><i class="bi bi-trash3"></i></button>`}
                        </td>
                        <td class="mem-col-name">
                            <div class="mem-nick">${esc(p?.nick_name || member.codename)}</div>
                            ${p?.full_name ? `<div class="mem-fullname">${esc(p.full_name)}</div>` : ''}
                        </td>
                        <td class="mem-col-code">${esc(p?.employee_id || '-')}</td>
                        <td class="mem-col-dept">${esc(p?.department || '-')}</td>
                        ${advancedMode ? `
                        <td class="mem-col-bulk-row">
                            <button class="mem-bulk-row-btn" onclick="bulkToggleRow('${esc(member.codename)}')" title="Toggle everything for ${esc(p?.nick_name || member.codename)}"><i class="bi bi-lightning-charge-fill"></i></button>
                        </td>` : ''}
                        <td class="mem-col-dashboard mem-zone-divider">
                            <label class="bq-toggle small">
                                <input type="checkbox" ${hasDashboard ? 'checked' : ''} onchange="onMemberDashboardToggle('${esc(member.codename)}', this.checked)">
                                <span class="bq-slider"></span>
                            </label>
                        </td>
                        <td class="mem-col-settings">
                            <label class="bq-toggle small">
                                <input type="checkbox" ${hasSetting ? 'checked' : ''} onchange="onMemberSettingToggle('${esc(member.codename)}', this.checked)">
                                <span class="bq-slider"></span>
                            </label>
                        </td>
                        <td class="mem-col-duplicate mem-zone-divider">
                            <label class="bq-toggle small">
                                <input type="checkbox" ${hasDuplicate ? 'checked' : ''} onchange="onMemberDuplicateToggle('${esc(member.codename)}', this.checked)">
                                <span class="bq-slider"></span>
                            </label>
                        </td>
                        <td class="mem-col-share">
                            <label class="bq-toggle small">
                                <input type="checkbox" ${hasShare ? 'checked' : ''} onchange="onMemberShareToggle('${esc(member.codename)}', this.checked)">
                                <span class="bq-slider"></span>
                            </label>
                        </td>
                        ${roles.map(r => {
                            const grant = grants.find(g => g.role_id === r.id);
                            return PERM_COLS.map((col, i) => {
                                const scopeCol = col === 'edit' ? 'edit_scope' : col === 'delete' ? 'delete_scope' : null;
                                const scope = scopeCol && grant?.[scopeCol] === 'all' ? 'all' : 'own';
                                return `
                            <td class="mem-col-action ${i === 0 ? 'mem-group-start' : ''}">
                                <div class="mem-action-cell">
                                    <label class="bq-dot" style="--dot-color:${r.color}">
                                        <input type="checkbox" ${grant && grant[col] ? 'checked' : ''} onchange="onMemberRoleActionToggle('${esc(member.codename)}', '${r.id}', '${col}', this.checked)">
                                        <span class="bq-dot-circle"></span>
                                    </label>
                                    ${scopeCol && grant && grant[col] ? `<button type="button" class="mem-scope-badge ${scope}" onclick="onMemberRoleScopeToggle('${esc(member.codename)}', '${r.id}', '${scopeCol}')" title="Click to switch to ${scope === 'own' ? 'All' : 'Own'}">${scope === 'own' ? 'Own' : 'All'}</button>` : ''}
                                </div>
                            </td>`;
                            }).join('');
                        }).join('')}
                    </tr>`;
                }).join('')}
            </tbody>
        </table>`;
    }

    // Pure state mutators (no markDirty/render) — shared by the single-cell
    // toggle handlers below and by Advanced Mode's bulk toggles, so a bulk
    // action over many rows doesn't re-render the whole table once per row.
    function setMemberPermFlag(codename, flag, checked) {
        const member = memberBuffer().find(m => m.codename === codename);
        const permissions = new Set(member?.permissions || []);
        checked ? permissions.add(flag) : permissions.delete(flag);
        if (!memberChanges[codename]) memberChanges[codename] = {};
        memberChanges[codename].permissions = [...permissions];
    }

    // Each action toggle is fully independent — no master switch, no
    // "granted with 0 perms" state. A grant is created the moment any one
    // action is turned on, and auto-revoked (row removed) the moment the
    // last remaining one is turned off.
    function setMemberRoleAction(codename, roleId, col, checked) {
        const real = originalMemberRoles.find(mr => mr.codename === codename && mr.role_id === roleId);
        const stagedNewKey = Object.keys(memberRoleChanges).find(id => id.startsWith('new-') && memberRoleChanges[id].codename === codename && memberRoleChanges[id].role_id === roleId);

        if (real) {
            memberRoleDeletes.delete(real.id); // toggling anything back on undoes a pending revoke, restoring the rest as-is
            if (!memberRoleChanges[real.id]) memberRoleChanges[real.id] = {};
            memberRoleChanges[real.id][col] = checked;
            const merged = { ...real, ...memberRoleChanges[real.id] };
            if (!PERM_COLS.some(c => merged[c])) memberRoleDeletes.add(real.id);
        } else if (stagedNewKey) {
            memberRoleChanges[stagedNewKey][col] = checked;
            if (!PERM_COLS.some(c => memberRoleChanges[stagedNewKey][c])) delete memberRoleChanges[stagedNewKey];
        } else if (checked) {
            const id = `new-${roleIdSeq--}`;
            const fresh = { codename, role_id: roleId, new: false, edit: false, delete: false, accept: false, assign: false, edit_scope: 'own', delete_scope: 'own' };
            fresh[col] = true;
            memberRoleChanges[id] = fresh;
        }
    }

    // Own/All only matters once the matching Edit/Delete grant is already
    // on, so there's always a real or staged-new row to flip this on — no
    // "create a grant" branch needed here like setMemberRoleAction has.
    function setMemberRoleScope(codename, roleId, scopeCol, value) {
        const real = originalMemberRoles.find(mr => mr.codename === codename && mr.role_id === roleId);
        const stagedNewKey = Object.keys(memberRoleChanges).find(id => id.startsWith('new-') && memberRoleChanges[id].codename === codename && memberRoleChanges[id].role_id === roleId);
        if (real) {
            if (!memberRoleChanges[real.id]) memberRoleChanges[real.id] = {};
            memberRoleChanges[real.id][scopeCol] = value;
        } else if (stagedNewKey) {
            memberRoleChanges[stagedNewKey][scopeCol] = value;
        }
    }

    function onMemberSettingToggle(codename, checked) {
        setMemberPermFlag(codename, 'setting', checked);
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function onMemberDashboardToggle(codename, checked) {
        setMemberPermFlag(codename, 'dashboard', checked);
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function onMemberDuplicateToggle(codename, checked) {
        setMemberPermFlag(codename, 'duplicate', checked);
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function onMemberShareToggle(codename, checked) {
        setMemberPermFlag(codename, 'share', checked);
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function onMemberRoleActionToggle(codename, roleId, col, checked) {
        setMemberRoleAction(codename, roleId, col, checked);
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    // Click-to-flip — only two values, so there's nothing worth a popover
    // for. scopeCol is 'edit_scope' or 'delete_scope'.
    function onMemberRoleScopeToggle(codename, roleId, scopeCol) {
        const grant = memberRoleBuffer().find(g => g.codename === codename && g.role_id === roleId && !g._deleted);
        const next = (grant?.[scopeCol] || 'own') === 'all' ? 'own' : 'all';
        setMemberRoleScope(codename, roleId, scopeCol, next);
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    // ── Advanced Mode — bulk column/row toggles for initial project setup.
    // Off by default; every bulk action is scoped to whatever's currently
    // visible (respecting search + column filters), never the full roster,
    // and stages through the same Save Bar as everything else (no separate
    // confirm dialog — Undo/Cancel already cover "I didn't mean that").
    function toggleAdvancedMode(checked) {
        advancedMode = checked;
        document.getElementById('section-members').classList.toggle('adv-mode-active', advancedMode);
        renderMembers(currentMemberFilter());
    }

    function bulkToggleColumn(roleId, col) {
        const rows = visibleMemberRows(currentMemberFilter());
        const grantsBuf = memberRoleBuffer();
        const allOn = rows.every(m => {
            const grant = grantsBuf.find(g => g.codename === m.codename && g.role_id === roleId && !g._deleted);
            return grant && grant[col];
        });
        rows.forEach(m => setMemberRoleAction(m.codename, roleId, col, !allOn));
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    // Third bulk axis: the role name itself — all 4 actions for that one
    // role, everyone currently visible. Reuses the exact same per-cell
    // mutator as the single-column version, just looped over PERM_COLS.
    function bulkToggleRole(roleId) {
        const rows = visibleMemberRows(currentMemberFilter());
        const grantsBuf = memberRoleBuffer();
        const allOn = rows.every(m => {
            const grant = grantsBuf.find(g => g.codename === m.codename && g.role_id === roleId && !g._deleted);
            return grant && PERM_COLS.every(c => grant[c]);
        });
        rows.forEach(m => PERM_COLS.forEach(col => setMemberRoleAction(m.codename, roleId, col, !allOn)));
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function bulkToggleFlag(flag) {
        const rows = visibleMemberRows(currentMemberFilter());
        const allOn = rows.every(m => (m.permissions || []).includes(flag));
        rows.forEach(m => setMemberPermFlag(m.codename, flag, !allOn));
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function bulkToggleRow(codename) {
        const roles = roleBuffer().filter(r => r.active !== false && !r._deleted);
        const grantsBuf = memberRoleBuffer();
        const member = memberBuffer().find(m => m.codename === codename);
        const hasSetting = (member?.permissions || []).includes('setting');
        const hasDashboard = (member?.permissions || []).includes('dashboard');
        const hasDuplicate = (member?.permissions || []).includes('duplicate');
        const hasShare = (member?.permissions || []).includes('share');
        const allOn = hasSetting && hasDashboard && hasDuplicate && hasShare && roles.every(r => {
            const grant = grantsBuf.find(g => g.codename === codename && g.role_id === r.id && !g._deleted);
            return grant && PERM_COLS.every(c => grant[c]);
        });
        const target = !allOn;
        roles.forEach(r => PERM_COLS.forEach(col => setMemberRoleAction(codename, r.id, col, target)));
        setMemberPermFlag(codename, 'dashboard', target);
        setMemberPermFlag(codename, 'setting', target);
        setMemberPermFlag(codename, 'duplicate', target);
        setMemberPermFlag(codename, 'share', target);
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function removeMember(codename) {
        if (!originalMembers.some(m => m.codename === codename)) { delete memberChanges[codename]; }
        else { memberDeletes.add(codename); }
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function undoRemoveMember(codename) {
        memberDeletes.delete(codename);
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function sortIcon(field) {
        if (memberSort.field !== field) return '<i class="bi bi-chevron-expand mem-sort-icon"></i>';
        // Down = A→Z (ascending), up = Z→A — matches the usual spreadsheet convention.
        return memberSort.dir === 'asc'
            ? '<i class="bi bi-chevron-down mem-sort-icon active"></i>'
            : '<i class="bi bi-chevron-up mem-sort-icon active"></i>';
    }

    function updateTableCount(shown, total) {
        document.getElementById('table-count').textContent = shown === total
            ? `${total}` : `${shown} / ${total}`;
    }

    function setupTableSearch() {
        document.getElementById('table-search').addEventListener('input', e => renderMembers(e.target.value.trim()));
    }


    // ── Add Member Modal ──
    let modalSelected = new Set();

    function openAddModal() {
        modalSelected.clear();
        document.getElementById('am-search').value = '';
        renderModalList('');
        updateModalFooter();
        document.getElementById('am-overlay').classList.add('show');
        setTimeout(() => document.getElementById('am-search').focus(), 100);
    }

    function closeAddModal(e) {
        if (e && e.target !== document.getElementById('am-overlay')) return;
        document.getElementById('am-overlay').classList.remove('show');
    }

    function availableProfiles(q = '') {
        const ql = q.toLowerCase();
        const existing = new Set(memberBuffer().map(m => m.codename));
        return allProfiles.filter(p =>
            !existing.has(p.codename) &&
            (p.codename.toLowerCase().includes(ql) ||
             (p.nick_name || '').toLowerCase().includes(ql) ||
             (p.full_name || '').toLowerCase().includes(ql) ||
             (p.employee_id || '').toLowerCase().includes(ql) ||
             (p.department || '').toLowerCase().includes(ql))
        );
    }

    function renderModalList(q = '') {
        const available = availableProfiles(q);
        const list = document.getElementById('am-list');
        if (!available.length) {
            list.innerHTML = `<div class="am-empty">No members available</div>`;
            return;
        }

        const selectedCount = available.filter(p => modalSelected.has(p.codename)).length;
        list.innerHTML = `
            <label class="am-item am-select-all">
                <input type="checkbox" class="modern-checkbox" id="am-select-all-cb" ${selectedCount === available.length ? 'checked' : ''} onchange="toggleAllModalItems(this.checked)">
                <div class="am-avatar"><i class="bi bi-people-fill"></i></div>
                <div class="am-info am-info-flat">
                    <span class="am-nick">Select All</span>
                    <span class="am-select-count">${available.length} available</span>
                </div>
            </label>
            ${available.map(p => `
                <label class="am-item">
                    <input type="checkbox" class="modern-checkbox" ${modalSelected.has(p.codename) ? 'checked' : ''} onchange="toggleModalItem('${esc(p.codename)}', this.checked)">
                    <div class="am-avatar"><i class="bi bi-person-fill"></i></div>
                    <div class="am-info">
                        <span class="am-nick">${esc(p.codename)}</span>
                        ${p.full_name ? `<span class="am-line2">${esc(p.full_name)}</span>` : ''}
                    </div>
                    ${p.department ? `<span class="am-dept-side">${esc(p.department)}</span>` : ''}
                </label>`).join('')}
        `;
        const selectAllCb = document.getElementById('am-select-all-cb');
        if (selectAllCb) selectAllCb.indeterminate = selectedCount > 0 && selectedCount < available.length;
    }

    function toggleModalItem(codename, checked) {
        checked ? modalSelected.add(codename) : modalSelected.delete(codename);
        renderModalList(document.getElementById('am-search').value.trim());
        updateModalFooter();
    }

    // Scoped to whatever the search currently narrows the list to — same
    // rule as the column filter's Select All.
    function toggleAllModalItems(checked) {
        const q = document.getElementById('am-search').value.trim();
        availableProfiles(q).forEach(p => checked ? modalSelected.add(p.codename) : modalSelected.delete(p.codename));
        renderModalList(q);
        updateModalFooter();
    }

    function updateModalFooter() {
        const n = modalSelected.size;
        const info = document.getElementById('am-footer-info');
        const btn  = document.getElementById('btn-am-confirm');
        info.textContent = n === 0 ? 'No member selected' : `${n} member${n > 1 ? 's' : ''} selected`;
        btn.disabled = n === 0;
    }

    function confirmAddMembers() {
        [...modalSelected].forEach(codename => { memberChanges[codename] = { permissions: [] }; });
        document.getElementById('am-overlay').classList.remove('show');
        markDirty('section-members');
        renderMembers(currentMemberFilter());
    }

    function setupAddSearch() {
        document.getElementById('am-search').addEventListener('input', e => renderModalList(e.target.value.trim()));
    }

    // This page has no <form> anywhere, so pressing Enter in a text/number
    // field normally does nothing — focus just stays stuck. Enter should
    // confirm the value and exit the field instead (there's nothing to
    // "submit" since every field already saves on blur/oninput into the
    // staged buffer).
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const el = e.target;
        if (el.tagName !== 'INPUT' || el.type === 'checkbox' || el.type === 'radio') return;
        e.preventDefault();
        el.blur();
    });

    loadPage();
</script>
</body>
</html>
