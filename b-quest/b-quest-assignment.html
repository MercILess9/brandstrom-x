<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>B-QUEST | Assignment</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/system/config.js"></script>
    <script src="/system/system.js"></script>
    <script src="/system/save-bar.js"></script>
    <script src="/system/multi-select.js"></script>
    <script src="b-quest.js"></script>
    <link rel="stylesheet" href="b-quest.css">

    <style>
        body { padding-bottom: 120px; }

        /* ==========================================================================
           FILTER ZONE — ported from b-quest-list.html's reusable pattern
           (search + sliding segmented control + date/today + advance panel +
           reset). Same mechanic, just fed Role instead of Status here, and
           Status demoted to a plain dropdown in the advance row instead —
           this page's primary axis is "which role's queue am I looking
           at", not status.
           ========================================================================== */
        .flt-wrapper { background: #fff; padding: 12px 20px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; border-radius: 16px; border: 1px solid var(--c-border); margin-bottom: 20px; }
        .flt-inner { max-width: 1300px; margin: 0 auto; }
        .flt-row { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; }
        .flt-sort-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .sort-seg-wrap { position: relative; display: flex; align-items: center; background: var(--c-bg); border: 1px solid #e2e8f0; border-radius: 20px; height: 38px; width: 72px; flex-shrink: 0; padding: 3px; }
        .sort-seg-slider { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--c-accent-light); border: 1px solid var(--c-accent); border-radius: 17px; transition: transform 0.25s cubic-bezier(.4,0,.2,1); z-index: 0; }
        .sort-seg-wrap:has(#sortDeadline.active) .sort-seg-slider { transform: translateX(100%); }
        .sort-seg-btn { position: relative; z-index: 1; flex: 1; height: 100%; border: none; background: transparent; font-size: 0.85rem; color: var(--c-slate); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .sort-seg-btn.active { color: #7a8500; }
        .sort-seg-btn:not(.active):hover { color: var(--c-accent); }
        .flt-right-group { display: flex; align-items: center; gap: 12px; margin-left: auto; }

        .flt-search-input:hover, .flt-date-group:hover, .flt-btn-adv:hover,
        .flt-btn-reset:hover {
            border-color: var(--c-accent); box-shadow: 0 2px 8px rgba(189,196,50,0.2); transform: translateY(-1px);
        }
        .flt-btn-adv:hover, .flt-btn-reset:hover { color: var(--c-accent); }
        .flt-btn-adv.active { background: var(--c-accent-light); border-color: var(--c-accent); color: #7a8500; }

        .flt-search { position: relative; flex: 0 1 320px; min-width: 140px; }
        .flt-search .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--c-text-muted); z-index: 2; pointer-events: none; }
        .flt-search-input { background: var(--c-bg); border: 1px solid #e2e8f0; border-radius: 20px; padding: 8px 34px 8px 40px; font-size: 0.85rem; width: 100%; outline: none; transition: 0.2s; }
        .clear-search-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #cbd5e1; cursor: pointer; z-index: 2; font-size: 0.85rem; transition: color 0.15s; }
        .clear-search-btn:hover { color: #94a3b8; }

        .flt-date-today-wrap { display: flex; align-items: center; flex-shrink: 0; }
        .flt-date-group { display: flex; align-items: center; background: var(--c-bg); border: 1px solid #e2e8f0; border-radius: 20px; padding: 0 14px; height: 38px; flex-shrink: 0; transition: 0.2s; }
        .flt-date-today-wrap.active-filter .flt-date-group { background: var(--c-accent-light); border-color: var(--c-accent); }
        .flt-date-input { border: none; background: transparent; font-size: 0.78rem; color: var(--c-slate); outline: none; font-family: inherit; width: 108px; }

        /* Role — same sliding-segment mechanic as Status uses on the List
           page, single-select ("All" + one button per role). */
        .role-seg-wrap { position: relative; display: flex; align-items: center; background: var(--c-bg); border: 1px solid #e2e8f0; border-radius: 20px; height: 38px; flex-shrink: 0; width: 400px; overflow: hidden; }
        .role-seg-label { flex-shrink: 0; background: #f1f5f9; color: #64748b; font-size: 0.6rem; font-weight: 800; padding: 0 10px; height: 100%; display: flex; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: 0.5px; border-right: 1px solid var(--c-border); white-space: nowrap; }
        .role-seg-scroll-outer { position: relative; flex: 1; min-width: 0; height: 100%; }
        .role-seg-scroll { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; height: 100%; padding: 3px; overflow-x: auto; scrollbar-width: none; }
        .role-seg-scroll::-webkit-scrollbar { display: none; }
        .role-seg-slider { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 0; background: var(--c-accent-light); border: 1px solid var(--c-accent); border-radius: 17px; transition: left 0.25s cubic-bezier(.4,0,.2,1), width 0.25s cubic-bezier(.4,0,.2,1); z-index: 0; }
        .role-seg-scroll-outer::before, .role-seg-scroll-outer::after { content: ''; position: absolute; top: 1px; bottom: 1px; width: 32px; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.2s; }
        .role-seg-scroll-outer::before { left: 0; background: linear-gradient(to right, rgba(30,41,59,0.16), transparent); }
        .role-seg-scroll-outer::after { right: 0; background: linear-gradient(to left, rgba(30,41,59,0.16), transparent); }
        .role-seg-scroll-outer.fade-left::before { opacity: 1; }
        .role-seg-scroll-outer.fade-right::after { opacity: 1; }
        .role-seg-btn { position: relative; z-index: 1; border: none; background: transparent; padding: 0 14px; height: 100%; font-size: 0.74rem; font-weight: 700; color: var(--c-slate); cursor: pointer; white-space: nowrap; transition: color 0.2s; flex-shrink: 0; display: flex; align-items: center; gap: 5px; }
        .role-seg-btn.active { color: #7a8500; }
        .role-seg-btn:not(.active):hover { color: var(--c-accent); }

        .flt-select-box { background: #fff; border: 1px solid var(--c-border); border-radius: 20px; display: flex; align-items: center; overflow: hidden; height: 38px; transition: 0.2s; width: 240px; flex-shrink: 0; }
        .flt-select-box:hover { border-color: var(--c-accent); box-shadow: 0 2px 8px rgba(189,196,50,0.2); transform: translateY(-1px); }
        .flt-select-tag { background: #f1f5f9; color: #64748b; font-size: 0.6rem; font-weight: 800; padding: 0 10px; height: 100%; display: flex; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: 0.5px; border-right: 1px solid var(--c-border); white-space: nowrap; transition: 0.2s; }
        .flt-select-box:hover .flt-select-tag { background: #e8edf2; color: var(--c-slate); }
        .flt-select-input { border: none; font-size: 0.8rem; font-weight: 600; color: var(--c-slate); padding: 0 8px; width: 100%; outline: none; background: transparent; cursor: pointer; font-family: inherit; text-align-last: center; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .flt-select-box.active-filter { background: var(--c-accent-light); border-color: var(--c-accent); }
        .flt-select-box.active-filter .flt-select-tag { background: var(--c-accent); color: var(--c-dark); border-right-color: var(--c-accent); }
        .flt-select-box.active-filter:hover { box-shadow: 0 2px 8px rgba(189,196,50,0.2); }

        .flt-btn-adv { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #e2e8f0; background: #fff; font-size: 1rem; color: var(--c-slate); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .flt-btn-reset { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #e2e8f0; background: #fff; color: #94a3b8; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; visibility: hidden; pointer-events: none; }
        .flt-btn-reset.has-filters { visibility: visible; pointer-events: auto; }

        .flt-advanced-zone { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out, opacity 0.3s ease; opacity: 0; border-top: 1px dashed transparent; }
        .flt-advanced-zone.show { max-height: 200px; opacity: 1; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #eee; }
        .flt-advanced-row { display: flex; align-items: center; gap: 12px; justify-content: center; flex-wrap: nowrap; }

        /* ── Page header ── */
        .page-header { margin: 0 0 20px; display: flex; align-items: center; gap: 10px; }
        .page-header h1 { font-size: 1.4rem; font-weight: 800; color: var(--c-dark); margin: 0; }
        .page-header .count-badge { background: var(--c-accent); color: var(--c-dark); border-radius: 20px; padding: 2px 12px; font-size: 0.78rem; font-weight: 800; }

        .assign-wrapper { max-width: 1300px; margin: 0 auto; padding: 24px 20px 40px; }

        /* ── Card list — free-floating cards, no wrapping "section" box
           (a box literally titled "Unassigned" around a page whose only
           job is showing unassigned items was pointless framing) ── */
        #list-rows { display: flex; flex-direction: column; gap: 10px; }

        .assign-card { display: flex; align-items: center; gap: 0; background: #fff; overflow: hidden; }
        .ac-zone { padding: 14px 18px; }
        .ac-zone + .ac-zone { border-left: 1px solid #f1f5f9; }

        .ac-left { width: 152px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; justify-content: center; align-items: center; }
        /* Role leads this zone now — a full-width bar, not a small pill —
           since which role a row belongs to matters more at a glance than
           its own deadline (that's why Role also drives the segmented
           filter up top, not Status). */
        .role-badge { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; padding: 6px 10px; border-radius: 10px; width: 100%; box-sizing: border-box; }
        .quest-id-label { font-size: 0.62rem; font-weight: 700; color: var(--c-muted); letter-spacing: 1px; text-align: center; }

        .ac-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .task-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .task-name { min-width: 0; font-size: 0.95rem; font-weight: 800; color: #0f172a; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .task-sub { font-size: 0.78rem; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .meta-chip { background: #f1f5f9; border-radius: 4px; padding: 2px 8px; font-size: 0.67rem; font-weight: 600; color: #64748b; }
        .status-chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; padding: 2px 8px; font-size: 0.67rem; font-weight: 700; }
        .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .pub-date { display: inline-flex; align-items: center; gap: 3px; background: #f1f5f9; border-radius: 4px; padding: 2px 8px; font-size: 0.67rem; font-weight: 600; color: #64748b; }
        .task-link { display: inline-flex; align-items: center; gap: 2px; font-size: 0.67rem; font-weight: 600; color: var(--c-accent); text-decoration: none; opacity: 0.85; transition: 0.12s; }
        .task-link:hover { opacity: 1; }

        /* Meta zone — same divider + stacked icon-line pattern as the
           List page's .bqc-meta-zone/.bqc-meta-line. */
        .ac-meta { width: 200px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .ac-meta-line { font-size: 0.72rem; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 5px; min-width: 0; }
        .ac-meta-line i { font-size: 0.8rem; width: 14px; text-align: center; flex-shrink: 0; }
        .ac-meta-line .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .ac-meta-line.dl-warning { color: #b88a30; }
        .ac-meta-line.dl-urgent  { color: #c06820; }
        .ac-meta-line.dl-overdue { color: #c04040; }

        /* Actions zone — floating, hover-reveal, no boxed/gray background,
           same mechanic as the List page's .bqc-actions. */
        /* Fixed width so a longer selected name never reflows ac-mid/ac-meta
           next to it — without this, picking a name changes this zone's
           content width, which (being the only non-fixed neighbor) shifts
           ac-meta's boundary and rows stop lining up with each other. */
        .ac-actions { width: 240px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 18px; }
        /* View is purely incidental (hover-only, always). The Assign
           dropdown gets its own visibility instead — it also stays
           visible whenever a selection is pending, so the picked name
           doesn't disappear the moment the mouse leaves the row. */
        .ac-btn-view { width: 32px; height: 32px; padding: 0; border: none; background: transparent; cursor: pointer; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.15s, opacity 0.2s; flex-shrink: 0; color: var(--c-slate); opacity: 0; }
        .assign-card-wrap:hover .ac-btn-view { opacity: 1; }
        .ac-btn-view:hover { background: var(--c-accent); color: #1e293b; }
        .ac-btn-assign { opacity: 0; max-width: 190px; border: 1px solid transparent; background: var(--c-accent); color: #1e293b; border-radius: 20px; padding: 7px 14px; font-size: 0.78rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; transition: filter 0.15s, opacity 0.2s; }
        .assign-card-wrap:hover .ac-btn-assign,
        .assign-card-wrap:has(.ac-btn-assign.is-pending) .ac-btn-assign { opacity: 1; }
        .ac-btn-assign:hover, .ac-btn-assign:focus { filter: brightness(1.06); }
        .ac-btn-assign .assign-btn-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .ac-btn-assign.is-pending { background: var(--c-accent-light); border-color: var(--c-accent); color: #7a8500; }

        .ac-detail { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; width: 100%; }
        .ac-detail.open { max-height: 200px; }
        .ac-detail-inner { padding: 12px 18px; border-top: 1px solid #f1f5f9; font-size: 0.8rem; color: #64748b; line-height: 1.6; font-family: var(--f-sarabun); max-height: 200px; overflow-y: auto; }
        .assign-card-wrap { position: relative; z-index: 1; display: flex; flex-direction: column; background: #fff; border-radius: 14px; border: 1px solid #eef2f7; border-left: 3px solid; box-shadow: 0 2px 8px -2px rgba(0,0,0,0.05); overflow: hidden; transition: box-shadow 0.2s, transform 0.15s; }
        .assign-card-wrap:hover { box-shadow: 0 8px 24px -4px rgba(0,0,0,0.09); }

        /* Assign picker popup — same recipe as the task Modal's own
           Assign picker (bq-search-overlay/bq-am-item) and Settings'
           Add Member modal, ported here since this page doesn't load
           b-quest-modal.js. */
        .bq-search-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
        .bq-search-card { background: #fff; width: 480px; max-height: 80vh; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,0.15); }
        .bq-search-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--c-border); }
        .bq-search-title { font-size: 1rem; font-weight: 800; color: var(--c-dark); margin: 0; display: flex; align-items: center; gap: 8px; }
        .bq-search-title i { color: var(--c-accent); }
        .bq-modal-close { background: #f1f5f9; border: none; border-radius: 8px; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #94a3b8; transition: 0.2s; flex-shrink: 0; }
        .bq-modal-close:hover { background: #e2e8f0; color: #1e293b; }
        .bq-uni-search-wrap { position: relative; margin-bottom: 14px; }
        .bq-uni-search { width: 100%; border-radius: 12px; padding: 9px 34px 9px 14px; font-size: 0.85rem; border: 1px solid var(--c-border); outline: none; font-family: inherit; transition: 0.2s; background: var(--c-bg); box-sizing: border-box; }
        .bq-uni-search:focus { border-color: var(--c-accent); background: #fff; box-shadow: none; }
        .bq-uni-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #cbd5e1; cursor: pointer; font-size: 0.85rem; transition: color 0.15s; }
        .bq-uni-clear:hover { color: #94a3b8; }
        .bq-am-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: background 0.15s; border: none; background: none; width: 100%; text-align: left; font-family: inherit; }
        .bq-am-item:hover { background: var(--c-bg); }
        .bq-am-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--c-accent-light); display: flex; align-items: center; justify-content: center; font-size: 0.95rem; color: #7a8500; flex-shrink: 0; }
        .bq-am-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
        .bq-am-nick { font-size: 0.85rem; font-weight: 700; color: var(--c-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bq-am-line2 { font-size: 0.72rem; color: var(--c-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bq-am-dept { flex-shrink: 0; font-size: 0.65rem; font-weight: 700; color: var(--c-slate); background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
        .bq-am-empty { padding: 30px; text-align: center; color: var(--c-muted); font-size: 0.82rem; font-weight: 600; }
        .bq-am-clear .bq-am-avatar { background: #f1f5f9; color: #94a3b8; }
        #assign-list-container { min-height: 280px; }

        .empty-state { padding: 60px 24px; text-align: center; color: var(--c-muted); background: #fff; border-radius: 14px; border: 1px dashed var(--c-border); }
        .empty-state i { font-size: 2.2rem; opacity: 0.3; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: 0.85rem; font-weight: 600; margin: 0; }
        .skel { background: #e8eaee; border-radius: 4px; animation: shimmer 1.4s infinite; }
        @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:0.45} }

        /* Floating Save Bar itself is the shared /system/save-bar.js
           component now (Cancel + Undo + nav guard built in) — no
           page-local markup/CSS needed. */
    </style>
</head>
<body>

<section id="filter-zone" class="flt-wrapper">
    <div class="flt-inner">
        <div class="flt-row">
            <div class="flt-sort-wrap">
                <div class="sort-seg-wrap">
                    <div class="sort-seg-slider" id="sortSegSlider"></div>
                    <button class="sort-seg-btn active" id="sortLastUpdate" title="Sort by Last Update"><i class="bi bi-clock-history"></i></button>
                    <button class="sort-seg-btn" id="sortDeadline" title="Sort by Deadline"><i class="bi bi-calendar3"></i></button>
                </div>
            </div>
            <div class="flt-search">
                <i class="bi bi-search search-icon"></i>
                <input type="text" class="flt-search-input" id="filterSearch" placeholder="Search...">
                <i class="bi bi-x-circle-fill clear-search-btn" id="clearSearchBtn" style="display:none;"></i>
            </div>
            <div class="flt-right-group">
                <div class="role-seg-wrap">
                    <span class="role-seg-label">Role</span>
                    <div class="role-seg-scroll-outer" id="roleSegOuter">
                        <div class="role-seg-scroll" id="roleSegWrap">
                            <div class="role-seg-slider" id="roleSegSlider"></div>
                            <!-- Buttons rendered by renderRoleSeg() from b-quest-role, same
                                 sliding-segment mechanic as Status uses on the List page. -->
                        </div>
                    </div>
                </div>
                <div class="flt-date-today-wrap">
                    <div class="flt-date-group">
                        <input type="date" class="flt-date-input" id="startDate">
                        <span style="color:#cbd5e1; padding: 0 2px;">-</span>
                        <input type="date" class="flt-date-input" id="endDate">
                    </div>
                </div>
                <button class="flt-btn-adv" id="toggleFilters" title="Advance Filters"><i class="bi bi-sliders"></i></button>
                <button class="flt-btn-reset" id="clearAllBtn" onclick="resetAllFilters()" title="Clear all filters"><i class="bi bi-arrow-counterclockwise"></i></button>
            </div>
        </div>

        <div class="flt-advanced-zone" id="advancedFilterZone">
            <div class="flt-advanced-row">
                <div class="flt-select-box" id="wrap-filterStatus"></div>
                <div class="flt-select-box" id="wrap-filterType"></div>
                <div class="flt-select-box" id="wrap-filterWork"></div>
                <div class="flt-select-box" id="wrap-filterOwner"></div>
            </div>
        </div>
    </div>
</section>

<div class="assign-wrapper">

    <div class="page-header">
        <h1><i class="bi bi-person-lines-fill me-2" style="color:var(--c-accent)"></i>B-QUEST Assignment</h1>
        <span class="count-badge" id="badge-count">0</span>
    </div>

    <div id="list-rows"></div>
    <div id="assign-load-more-trigger" style="height:50px;"></div>

</div>

<div id="assign-search-overlay" class="bq-search-overlay" onclick="closeAssignOverlay()">
    <div class="bq-search-card" onclick="event.stopPropagation()">
        <div class="bq-search-header">
            <h5 class="bq-search-title"><i class="bi bi-person-check-fill"></i> Assign</h5>
            <button type="button" class="bq-modal-close" onclick="closeAssignOverlay()"><i class="bi bi-x"></i></button>
        </div>
        <div class="bq-uni-search-wrap">
            <input type="text" class="bq-uni-search" id="assign-search-input" placeholder="Search...">
            <i class="bi bi-x-circle-fill bq-uni-clear" id="assign-search-clear" style="display:none;"></i>
        </div>
        <div id="assign-list-container" style="overflow-y: auto; flex: 1; padding-right:5px;"></div>
    </div>
</div>

<script>
    // ── State ──
    let roleList = [];          // [{id, name, color, icon}] — roles this user can Assign on
    let roleNameMap = {};       // role_id -> name
    let roleColorMap = {};      // role_id -> color
    let statusList = [];        // [{id, name, color}] — active statuses, for the Status dropdown
    let statusNameMap = {};     // status_id -> name
    let statusColorMap = {};    // status_id -> color
    let assignCandidates = {};  // role_id -> [{codename, full_name, department}] (accept=true members)
    let workList  = [];         // [{work, role_id}]
    let typeList  = [];         // [{name}] — active types, for the Type multi-select
    let ownerList = [];
    // createMultiSelect() instances — all initialized once in loadPage()
    let statusFilter, typeFilter, workFilter, ownerFilter;
    let allRows  = [];          // task-role rows, each with an embedded .quest (b-quest-list fields)
    let openDetailIds = new Set();
    let pendingAssign = {};     // taskRoleId -> { taskRoleId, questId, value }
    let assignPage = 0;
    let assignHasMore = true;
    let assignFetching = false;
    let sortBy = 'last_update'; // 'deadline' | 'last_update'
    let saveBar;

    // ── Init ──
    async function loadPage() {
        saveBar = createSaveBar({ label: 'B-Quest Assignment', onSave: saveAll, onCancel: cancelAllChanges });
        setupMultiSelects();
        sessionStorage.removeItem('bx_perms_bquest');
        await initLayout(B_QUEST_CONFIG);
        guardBquestPage('assign');
        await Promise.all([loadRoles(), loadAssignCandidates(), loadWorkList(), loadStatusList(), loadTypeList(), loadOwnerList()]);
        renderRoleSeg();
        await loadRows(true);
        setupSearch();
        setupInfiniteScroll();
        setupDateToday();
        setupSort();
    }

    function setupMultiSelects() {
        statusFilter = createMultiSelect({
            trigger: document.getElementById('wrap-filterStatus'),
            label: 'Status',
            getOptions: () => statusList.map(s => ({ value: s.id, label: s.name })),
            onChange: () => applyFilters()
        });
        typeFilter = createMultiSelect({
            trigger: document.getElementById('wrap-filterType'),
            label: 'Type',
            getOptions: () => typeList.map(t => ({ value: t.name, label: t.name })),
            onChange: () => applyFilters()
        });
        workFilter = createMultiSelect({
            trigger: document.getElementById('wrap-filterWork'),
            label: 'Work',
            getOptions: workOptions,
            onChange: () => applyFilters(),
            width: 340
        });
        ownerFilter = createMultiSelect({
            trigger: document.getElementById('wrap-filterOwner'),
            label: 'Owner',
            getOptions: () => ownerList.map(o => ({ value: o, label: o })),
            onChange: () => applyFilters()
        });
    }

    // Only roles this user can actually Assign on ever get a tab — no
    // point showing a queue for a role they can never act on.
    // (Future: Settings will let the default selected tab be configured
    // per-member instead of always starting on "All".)
    async function loadRoles() {
        const { data } = await supabaseClient.from('b-quest-role').select('id, name, color, icon').eq('active', true).order('sort_order');
        const all = data || [];
        roleList = all.filter(r => typeof canBquestEditRole !== 'function' || canBquestEditRole(r.name, 'assign'));
        roleNameMap = Object.fromEntries(all.map(r => [r.id, r.name]));
        roleColorMap = Object.fromEntries(all.map(r => [r.id, r.color || '#64748b']));
    }

    // Candidates to assign TO — only members who can Accept work in that
    // role (same rule as the Modal's Assign picker), not everyone who
    // merely has some permission on it.
    async function loadAssignCandidates() {
        const { data: memberRoles } = await supabaseClient.from('b-quest-member-role').select('codename, role_id').eq('accept', true);
        const codenames = [...new Set((memberRoles || []).map(r => r.codename))];
        const { data: profiles } = codenames.length
            ? await supabaseClient.from('profiles').select('codename, full_name, department').in('codename', codenames)
            : { data: [] };
        const profileMap = Object.fromEntries((profiles || []).map(p => [p.codename, p]));
        assignCandidates = {};
        (memberRoles || []).forEach(r => {
            if (!r.role_id) return;
            (assignCandidates[r.role_id] ||= []).push(profileMap[r.codename] || { codename: r.codename });
        });
    }

    async function loadWorkList() {
        const { data } = await supabaseClient.from('b-quest-work').select('work, role_id').order('work');
        workList = data || [];
    }

    async function loadStatusList() {
        const { data } = await supabaseClient.from('b-quest-status').select('id, name, color').eq('active', true).order('sort_order');
        statusList = data || [];
        statusNameMap = Object.fromEntries(statusList.map(s => [s.id, s.name]));
        statusColorMap = Object.fromEntries(statusList.map(s => [s.id, s.color || '#94a3b8']));
        // Drop any selected status that no longer exists (renamed/deactivated
        // in Settings) instead of leaving the filter silently stuck on it.
        if (statusFilter) statusFilter.setValues(statusFilter.getValues().filter(v => statusList.some(s => s.id === v)));
    }

    async function loadTypeList() {
        const { data } = await supabaseClient.from('b-quest-type').select('name').eq('active', true).order('sort_order');
        typeList = data || [];
        if (typeFilter) typeFilter.setValues(typeFilter.getValues().filter(v => typeList.some(t => t.name === v)));
    }

    // ── Role segmented control (single-select, "All" + one per role) ──
    function renderRoleSeg() {
        const wrap = document.getElementById('roleSegWrap');
        if (!wrap) return;
        const prevValue = getRoleFilter();
        const buttons = [{ label: 'All', value: '', icon: '' }, ...roleList.map(r => ({ label: r.name, value: r.id, icon: r.icon || 'bi-person-workspace' }))];
        const activeValue = buttons.some(b => b.value === prevValue) ? prevValue : '';

        wrap.querySelectorAll('.role-seg-btn').forEach(b => b.remove());
        buttons.forEach(b => {
            const btn = document.createElement('button');
            btn.className = 'role-seg-btn' + (b.value === activeValue ? ' active' : '');
            btn.dataset.role = b.value;
            btn.innerHTML = b.icon ? `<i class="bi ${b.icon}"></i> ${esc(b.label)}` : esc(b.label);
            btn.onclick = () => setRoleFilter(b.value);
            wrap.appendChild(btn);
        });
        positionRoleSlider();
    }

    function setRoleFilter(value) {
        document.querySelectorAll('.role-seg-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.role === value));
        positionRoleSlider();
        if (workFilter) workFilter.setValues(workFilter.getValues().filter(v => workOptions().some(o => o.value === v)));
        applyFilters();
    }

    function getRoleFilter() {
        return document.querySelector('.role-seg-btn.active')?.dataset.role || '';
    }

    function positionRoleSlider() {
        const active = document.querySelector('.role-seg-btn.active');
        const slider = document.getElementById('roleSegSlider');
        if (!active || !slider) return;
        slider.style.left = active.offsetLeft + 'px';
        slider.style.width = active.offsetWidth + 'px';

        // "All" keeps the default accent color (cleared inline styles fall
        // back to the CSS default); a specific role tints the slider/label
        // with that role's own color instead.
        const color = active.dataset.role ? (roleColorMap[active.dataset.role] || '#64748b') : '';
        document.querySelectorAll('.role-seg-btn').forEach(b => { b.style.color = ''; });
        if (color) {
            slider.style.background = hexToRgba(color, 0.15);
            slider.style.borderColor = color;
            active.style.color = color;
        } else {
            slider.style.background = '';
            slider.style.borderColor = '';
        }

        active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        updateRoleSegFade();
    }

    function updateRoleSegFade() {
        const scroll = document.getElementById('roleSegWrap');
        const outer = document.getElementById('roleSegOuter');
        if (!scroll || !outer) return;
        outer.classList.toggle('fade-left', scroll.scrollLeft > 2);
        outer.classList.toggle('fade-right', scroll.scrollLeft + scroll.clientWidth < scroll.scrollWidth - 2);
    }

    function hexToRgba(hex, alpha) {
        const h = (hex || '#64748b').replace('#', '');
        const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
        const n = parseInt(full, 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
    }

    // ── Data ──
    // Search/Owner live on the parent b-quest-list row, not on
    // b-quest-task-role itself — same two-step approach List.html uses
    // (getMatchingQuestIds): find matching quest ids first, then filter
    // task-role by quest_id. Returns null when neither filter is active
    // (= no restriction from this step).
    async function getMatchingQuestIds() {
        const owners = ownerFilter?.getValues() || [];
        const qInput = document.getElementById('filterSearch').value.trim();
        if (!owners.length && !qInput) return null;

        let q = supabaseClient.from('b-quest-list').select('id');
        if (owners.length) q = q.in('owner', owners);
        if (qInput) q = q.or(['task_name', 'account_name', 'opportunity_name'].map(col => `${col}.ilike.%${qInput}%`).join(','));
        const { data } = await q;
        return (data || []).map(r => r.id);
    }

    // All filters (role/status/type/work/owner/search/date) are applied
    // server-side in this query — everything here used to be re-filtered
    // client-side over whatever had already been paginated into allRows,
    // which meant Search/filters could only ever "find" something already
    // scrolled into view and silently missed anything further down the
    // real dataset. { count: 'exact' } drives the header badge off the
    // true total, not just what's loaded so far.
    async function loadRows(isFirst = false) {
        if (assignFetching || (!assignHasMore && !isFirst)) return;
        assignFetching = true;

        const limit = B_QUEST_CONFIG.itemsPerPage_Assign || 10;
        const from = assignPage * limit;
        const to = from + limit - 1;

        if (isFirst) document.getElementById('list-rows').innerHTML = skeletonHTML();

        const matchIds = await getMatchingQuestIds();
        if (matchIds !== null && matchIds.length === 0) {
            if (isFirst) { allRows = []; renderRows([]); document.getElementById('badge-count').textContent = 0; }
            assignHasMore = false; assignFetching = false;
            return;
        }

        let query = supabaseClient
            .from('b-quest-task-role')
            .select('id, quest_id, role_id, work, type, deadline, status_id, weight, assign, quest:"b-quest-list"(id, task_name, account_name, opportunity_name, detail, link, publish_date, owner, last_update)', { count: 'exact' })
            .or('assign.is.null,assign.eq.-')
            .not('quest_id', 'is', null);

        if (matchIds !== null) query = query.in('quest_id', matchIds);

        // roleList is already scoped to "roles this user can Assign on" —
        // enforced here even with no specific tab selected ("All"),
        // otherwise "All" would leak rows for roles the user has no
        // assign permission on at all.
        const roleInput = getRoleFilter();
        query = roleInput ? query.eq('role_id', roleInput) : query.in('role_id', roleList.length ? roleList.map(r => r.id) : ['00000000-0000-0000-0000-000000000000']);

        const statusInputs = statusFilter?.getValues() || [];
        if (statusInputs.length) query = query.in('status_id', statusInputs);
        const typeInputs = typeFilter?.getValues() || [];
        if (typeInputs.length) query = query.in('type', typeInputs);
        const workInputs = workFilter?.getValues() || [];
        if (workInputs.length) query = query.in('work', workInputs);
        const startDate = document.getElementById('startDate').value;
        if (startDate) query = query.gte('deadline', startDate);
        const endDate = document.getElementById('endDate').value;
        if (endDate) query = query.lte('deadline', endDate);

        query = sortBy === 'last_update'
            ? query.order('last_update', { foreignTable: 'quest', ascending: false, nullsFirst: false })
            : query.order('deadline', { ascending: true, nullsFirst: false });
        query = query.range(from, to);

        const { data, error, count } = await query;
        if (error) { console.error(error); assignFetching = false; return; }

        const newRows = (data || []).filter(r => r.quest); // drop any row whose parent task vanished
        if (data.length < limit) assignHasMore = false;

        allRows = isFirst ? newRows : allRows.concat(newRows);
        assignPage++;
        assignFetching = false;

        document.getElementById('badge-count').textContent = count ?? allRows.length;
        renderRows(allRows);
        updateClearAllVisibility();
    }

    function resetAndReload() {
        assignPage = 0; assignHasMore = true; assignFetching = false;
        allRows = [];
        loadRows(true);
    }

    // Owner options come from a dedicated query (independent of
    // pagination) so the dropdown always reflects every possible owner,
    // not just whatever happened to already be loaded.
    async function loadOwnerList() {
        const { data } = await supabaseClient.from('b-quest-list').select('owner').not('owner', 'is', null).neq('owner', '-');
        ownerList = [...new Set((data || []).map(r => r.owner).filter(Boolean))].sort();
        populateFilterOwner();
    }

    function setupInfiniteScroll() {
        const trigger = document.getElementById('assign-load-more-trigger');
        if (!trigger) return;
        const observer = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting && !assignFetching && assignHasMore) loadRows();
        }, { rootMargin: '100px' });
        observer.observe(trigger);
    }

    // ── Filters ──
    // Live-computed (called fresh each time the Work popover opens), scoped
    // to whichever role is currently active in the carousel — no separate
    // "rebuild on role change" step needed, but a role change can still
    // strand a previously-picked Work value outside the new scope, so
    // setRoleFilter() prunes against this after switching roles.
    function workOptions() {
        const activeRole = getRoleFilter();
        const opts = [];
        roleList.filter(r => !activeRole || r.id === activeRole).forEach(r => {
            workList.filter(w => w.role_id === r.id).forEach(w => {
                opts.push({ value: w.work, label: w.work, group: r.name });
            });
        });
        return opts;
    }

    function populateFilterOwner() {
        // Drop any selected owner that no longer exists in the fresh list
        // instead of leaving the filter silently stuck on a name nothing
        // can match anymore.
        if (ownerFilter) {
            const kept = ownerFilter.getValues().filter(v => ownerList.includes(v));
            ownerFilter.setValues(kept);
        }
    }

    function updateDateHighlight() {
        const s = document.getElementById('startDate').value;
        const e = document.getElementById('endDate').value;
        document.querySelector('.flt-date-today-wrap').classList.toggle('active-filter', !!(s || e));
    }
    function setupSearch() {
        let timer;
        const input = document.getElementById('filterSearch');
        input.addEventListener('input', () => {
            document.getElementById('clearSearchBtn').style.display = input.value ? 'block' : 'none';
            clearTimeout(timer); timer = setTimeout(applyFilters, 250);
        });
        document.getElementById('clearSearchBtn').addEventListener('click', () => {
            input.value = ''; document.getElementById('clearSearchBtn').style.display = 'none';
            input.focus(); applyFilters();
        });
    }
    function setupDateToday() {
        document.getElementById('toggleFilters').addEventListener('click', () => {
            const zone = document.getElementById('advancedFilterZone');
            const btn = document.getElementById('toggleFilters');
            zone.classList.toggle('show');
            btn.classList.toggle('active', zone.classList.contains('show'));
        });
        ['startDate', 'endDate'].forEach(id => {
            document.getElementById(id)?.addEventListener('change', () => {
                updateDateHighlight();
                applyFilters();
            });
        });
        document.getElementById('roleSegWrap')?.addEventListener('scroll', updateRoleSegFade);
    }

    function setupSort() {
        document.getElementById('sortDeadline').addEventListener('click', () => setSortBy('deadline'));
        document.getElementById('sortLastUpdate').addEventListener('click', () => setSortBy('last_update'));
    }
    function setSortBy(value) {
        if (sortBy === value) return;
        sortBy = value;
        document.getElementById('sortDeadline').classList.toggle('active', value === 'deadline');
        document.getElementById('sortLastUpdate').classList.toggle('active', value === 'last_update');
        resetAndReload();
    }

    // Every filter now drives the server-side query directly (see
    // loadRows/getMatchingQuestIds) — this just restarts pagination with
    // the new filter state instead of re-filtering an in-memory page.
    function applyFilters() {
        updateClearAllVisibility();
        resetAndReload();
    }

    function updateClearAllVisibility() {
        const val = id => document.getElementById(id)?.value || '';
        const anyActive = val('filterSearch') || val('startDate') || val('endDate') || getRoleFilter() ||
            statusFilter?.getValues().length || typeFilter?.getValues().length || workFilter?.getValues().length || ownerFilter?.getValues().length;
        document.getElementById('clearAllBtn')?.classList.toggle('has-filters', !!anyActive);
    }

    function resetAllFilters() {
        document.getElementById('filterSearch').value = ''; document.getElementById('clearSearchBtn').style.display = 'none';
        document.getElementById('startDate').value = ''; document.getElementById('endDate').value = '';
        updateDateHighlight();
        statusFilter?.clear();
        typeFilter?.clear();
        workFilter?.clear();
        ownerFilter?.clear();
        setRoleFilter('');
    }

    // ── Render ──
    function renderRows(rows) {
        const container = document.getElementById('list-rows');
        if (!rows.length) { container.innerHTML = `<div class="empty-state"><i class="bi bi-inbox"></i><p>No unassigned items</p></div>`; return; }

        container.innerHTML = rows.map(r => {
            const q = r.quest;
            const roleName = roleNameMap[r.role_id] || 'Unknown';
            const color = roleColorMap[r.role_id] || '#64748b';
            const candidates = assignCandidates[r.role_id] || [];
            const pending = pendingAssign[r.id];
            const isOpen = openDetailIds.has(r.id);
            const toggleAttr = q.detail ? `onclick="toggleDetail('${r.id}')" style="cursor:pointer"` : '';

            return `
            <div class="assign-card-wrap" style="border-left-color:${color}" id="row-${r.id}">
                <div class="assign-card">
                    <div class="ac-zone ac-left" ${toggleAttr}>
                        <span class="quest-id-label">${esc(r.quest_id)}</span>
                        <div class="role-badge" style="background:${hexToRgba(color,0.15)};color:${color}"><i class="bi ${roleIconFor(r.role_id)}"></i> ${esc(roleName)}</div>
                    </div>

                    <div class="ac-zone ac-mid" ${toggleAttr}>
                        <div class="task-name">${esc(q.task_name) || 'Untitled'}</div>
                        ${(q.account_name || q.opportunity_name) ? `<div class="task-sub">${[esc(q.account_name), esc(q.opportunity_name)].filter(Boolean).join(' | ')}</div>` : ''}
                        <div class="task-tags">
                            ${statusNameMap[r.status_id] ? `<span class="status-chip" style="background:${hexToRgba(statusColorMap[r.status_id],0.12)};color:${statusColorMap[r.status_id]}"><span class="dot" style="background:${statusColorMap[r.status_id]}"></span>${esc(statusNameMap[r.status_id])}</span>` : ''}
                            ${r.type ? `<span class="meta-chip">${esc(r.type)}</span>` : ''}
                            ${r.work ? `<span class="meta-chip">${esc(r.work)}</span>` : ''}
                            ${q.publish_date ? `<span class="pub-date"><i class="bi bi-send"></i> ${formatDate(q.publish_date)}</span>` : ''}
                            ${q.link ? `<a class="task-link" href="${safeLink(q.link)}" target="_blank" rel="noopener"><i class="bi bi-link-45deg"></i> Link</a>` : ''}
                        </div>
                    </div>

                    <div class="ac-zone ac-meta" ${toggleAttr}>
                        <div class="ac-meta-line ${dlUrgency(r.deadline)}"><i class="bi bi-calendar3"></i><span class="val">${r.deadline ? formatDate(r.deadline) : '-'}</span></div>
                        <div class="ac-meta-line"><i class="bi bi-person-fill"></i><span class="val">${esc(q.owner) || '-'}</span></div>
                    </div>

                    <div class="ac-actions">
                        <button class="ac-btn-view" onclick="handleViewAssignTask('${r.quest_id}')" title="View"><i class="bi bi-eye"></i></button>
                        <button class="ac-btn-assign ${pending ? 'is-pending' : ''}" type="button" onclick="openAssignPicker('${r.id}','${r.quest_id}','${r.role_id}')">
                            <i class="bi ${pending ? 'bi-person-check' : 'bi-person-plus'}"></i><span class="assign-btn-label">${pending ? esc(pending.value) : 'Assign'}</span>
                        </button>
                    </div>
                </div>
                ${q.detail ? `<div class="ac-detail ${isOpen ? 'open' : ''}" id="detail-${r.id}"><div class="ac-detail-inner">${esc(q.detail).replace(/\n/g, '<br>')}</div></div>` : ''}
            </div>`;
        }).join('');
    }

    function roleIconFor(roleId) {
        const r = roleList.find(x => x.id === roleId);
        return (r && r.icon) || 'bi-person-workspace';
    }

    function toggleDetail(taskRoleId) {
        if (openDetailIds.has(taskRoleId)) openDetailIds.delete(taskRoleId); else openDetailIds.add(taskRoleId);
        const panel = document.getElementById(`detail-${taskRoleId}`);
        if (panel) panel.classList.toggle('open');
    }

    function skeletonHTML() {
        const row = () => `
        <div class="assign-card-wrap" style="pointer-events:none;border-left-color:#e2e8f0">
            <div class="assign-card">
                <div class="ac-zone ac-left">
                    <div class="skel" style="height:10px;width:50px;border-radius:3px"></div>
                    <div class="skel" style="height:18px;width:88px;border-radius:20px"></div>
                </div>
                <div class="ac-zone ac-mid">
                    <div class="skel" style="height:14px;width:55%;border-radius:3px;margin-bottom:6px"></div>
                    <div class="skel" style="height:10px;width:38%;border-radius:3px;margin-bottom:8px"></div>
                    <div style="display:flex;gap:5px"><div class="skel" style="height:17px;width:54px;border-radius:4px"></div><div class="skel" style="height:17px;width:42px;border-radius:4px"></div></div>
                </div>
                <div class="ac-zone ac-meta">
                    <div class="skel" style="height:12px;width:70px;border-radius:3px"></div>
                    <div class="skel" style="height:12px;width:60px;border-radius:3px"></div>
                </div>
            </div>
        </div>`;
        return row() + row() + row() + row();
    }

    // Placeholder — same "coming soon" pattern as the List page's own View
    // button (handleViewTask in b-quest.js) until there's an actual detail
    // page to link to.
    function handleViewAssignTask(questId) {
        notify('', 'View page coming soon', 'info');
    }

    function dlUrgency(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d)) return '';
        const days = Math.ceil((d - new Date()) / 86400000);
        if (days < 0)  return 'dl-overdue';
        if (days <= 3) return 'dl-urgent';
        if (days <= 7) return 'dl-warning';
        return 'dl-ok';
    }

    // ── Pending Assign ──
    function selectAssignee(taskRoleId, questId, newVal) {
        const btn = document.querySelector(`#row-${taskRoleId} .ac-btn-assign`);

        if (!newVal) {
            delete pendingAssign[taskRoleId];
            if (btn) { btn.classList.remove('is-pending'); btn.innerHTML = '<i class="bi bi-person-plus"></i><span class="assign-btn-label">Assign</span>'; }
        } else {
            pendingAssign[taskRoleId] = { taskRoleId, questId, value: newVal };
            if (btn) { btn.classList.add('is-pending'); btn.innerHTML = `<i class="bi bi-person-check"></i><span class="assign-btn-label">${esc(newVal)}</span>`; }
        }
        updateSaveBar();
    }

    // ── Assign picker popup — same recipe as the task Modal's own
    // openAssignPicker (avatar + name + department, click to pick) ──
    function openAssignPicker(taskRoleId, questId, roleId) {
        const candidates = assignCandidates[roleId] || [];
        const overlay = document.getElementById('assign-search-overlay');
        const container = document.getElementById('assign-list-container');
        const searchInput = document.getElementById('assign-search-input');

        const clearIcon = document.getElementById('assign-search-clear');
        overlay.style.display = 'flex';
        searchInput.value = '';
        clearIcon.style.display = 'none';

        const render = (filter = '') => {
            container.innerHTML = '';
            const clearBtn = document.createElement('button');
            clearBtn.className = 'bq-am-item bq-am-clear w-100';
            clearBtn.innerHTML = `
                <div class="bq-am-avatar"><i class="bi bi-x-circle"></i></div>
                <div class="bq-am-info"><span class="bq-am-nick">Unassigned</span></div>`;
            clearBtn.onclick = () => { selectAssignee(taskRoleId, questId, ''); closeAssignOverlay(); };
            container.appendChild(clearBtn);

            const fl = filter.toLowerCase();
            const matches = candidates.filter(c =>
                c.codename.toLowerCase().includes(fl) ||
                (c.full_name || '').toLowerCase().includes(fl) ||
                (c.department || '').toLowerCase().includes(fl)
            );
            if (!matches.length) {
                container.insertAdjacentHTML('beforeend', `<div class="bq-am-empty">${filter ? 'No matches' : 'No candidates for this role'}</div>`);
            }
            matches.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'bq-am-item w-100';
                btn.innerHTML = `
                    <div class="bq-am-avatar"><i class="bi bi-person-fill"></i></div>
                    <div class="bq-am-info">
                        <span class="bq-am-nick">${esc(c.codename)}</span>
                        ${c.full_name ? `<span class="bq-am-line2">${esc(c.full_name)}</span>` : ''}
                    </div>
                    ${c.department ? `<span class="bq-am-dept">${esc(c.department)}</span>` : ''}`;
                btn.onclick = () => { selectAssignee(taskRoleId, questId, c.codename); closeAssignOverlay(); };
                container.appendChild(btn);
            });
        };
        render();
        searchInput.oninput = e => {
            clearIcon.style.display = e.target.value ? 'block' : 'none';
            render(e.target.value);
        };
        clearIcon.onclick = () => {
            searchInput.value = '';
            clearIcon.style.display = 'none';
            searchInput.focus();
            render('');
        };
    }

    function closeAssignOverlay() {
        document.getElementById('assign-search-overlay').style.display = 'none';
    }

    function updateSaveBar() {
        saveBar.setCount(Object.keys(pendingAssign).length);
    }

    async function saveAll() {
        const entries = Object.entries(pendingAssign);
        let saved = 0, failed = 0;

        for (const [taskRoleId, { questId, value }] of entries) {
            const { error } = await supabaseClient.from('b-quest-task-role').update({ assign: value }).eq('id', taskRoleId);
            if (error) { failed++; continue; }
            await supabaseClient.from('b-quest-list').update({ last_update: new Date().toISOString() }).eq('id', questId);
            delete pendingAssign[taskRoleId];
            saved++;
        }

        if (failed) Swal.fire({ icon: 'error', title: `บันทึกไม่สำเร็จ ${failed} รายการ`, timer: 3000, showConfirmButton: false });
        if (saved) notify('Assigned', `บันทึกสำเร็จ ${saved} รายการ`, 'success');

        saveBar.setCount(Object.keys(pendingAssign).length);
        applyFilters(); // re-fetch fresh from the server — the rows just saved are gone from the queue for real now
    }

    // Cancel on the shared save bar — nothing was written to the server
    // yet, so reverting is just dropping the local pending state and
    // re-rendering the already-loaded rows (no refetch needed).
    function cancelAllChanges() {
        pendingAssign = {};
        renderRows(allRows);
    }

    loadPage();
</script>
</body>
</html>
